
<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Greg AI</title>

  <style>

    :root {

      --bg: #050b08;
      --bg2: #030605;

      --text: #ecf7ef;
      --muted: #92a99d;

      --accent: #8df0a0;
      --accent-2: #54c7ff;

      --good: #8df0a0;
      --warn: #ffd56a;
      --bad: #ff7f7f;

      --line: rgba(255,255,255,0.08);

      --code-bg: #0a0d0c;
      --code-header: #111614;
      --code-line: rgba(255,255,255,0.06);

      --shadow: 0 22px 60px rgba(0,0,0,0.42);

      --sans:
        Inter,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;

      --mono:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      color: var(--text);

      font-family: var(--sans);

      background:
        radial-gradient(
          circle at top,
          rgba(105,255,170,0.12),
          transparent 34%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(84,199,255,0.08),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          var(--bg),
          var(--bg2) 72%
        );

      overflow: hidden;
    }


    button,
    textarea {
      font: inherit;
    }


    /* ========================================================
       ANIMATED BACKGROUND
       ======================================================== */

    #bgCanvas {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;

      pointer-events: none;
    }


    .animated-bg {

      position: fixed;
      inset: 0;

      z-index: 0;

      overflow: hidden;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(141,240,160,0.10),
          transparent 22%
        ),
        radial-gradient(
          circle at 80% 15%,
          rgba(84,199,255,0.10),
          transparent 20%
        ),
        radial-gradient(
          circle at 50% 78%,
          rgba(255,213,106,0.08),
          transparent 24%
        ),
        linear-gradient(
          180deg,
          rgba(3,6,5,0.92),
          rgba(5,11,8,0.96)
        );
    }


    .animated-bg::before,
    .animated-bg::after {

      content: "";

      position: absolute;

      inset: -35%;

      background-repeat: no-repeat;

      filter:
        blur(32px)
        saturate(1.3);

      opacity: 0.85;

      animation:
        bgDrift 12s ease-in-out infinite alternate,
        bgHue 22s linear infinite;
    }


    .animated-bg::before {

      background-image:
        radial-gradient(
          circle at 14% 24%,
          rgba(255,93,184,0.30),
          transparent 18%
        ),
        radial-gradient(
          circle at 42% 18%,
          rgba(84,199,255,0.32),
          transparent 19%
        ),
        radial-gradient(
          circle at 78% 24%,
          rgba(141,240,160,0.30),
          transparent 20%
        ),
        radial-gradient(
          circle at 24% 78%,
          rgba(255,213,106,0.24),
          transparent 22%
        ),
        radial-gradient(
          circle at 72% 74%,
          rgba(160,102,255,0.28),
          transparent 20%
        );
    }


    .animated-bg::after {

      background-image:
        radial-gradient(
          circle at 18% 52%,
          rgba(84,199,255,0.20),
          transparent 16%
        ),
        radial-gradient(
          circle at 52% 34%,
          rgba(255,120,120,0.16),
          transparent 15%
        ),
        radial-gradient(
          circle at 82% 58%,
          rgba(141,240,160,0.20),
          transparent 16%
        ),
        radial-gradient(
          circle at 50% 92%,
          rgba(255,255,255,0.05),
          transparent 24%
        );

      animation-duration:
        16s,
        28s;

      animation-direction:
        alternate-reverse,
        normal;

      opacity: 0.7;
    }


    .animated-grid {

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        );

      background-size: 64px 64px;

      mask-image:
        radial-gradient(
          circle at center,
          black 22%,
          transparent 78%
        );

      opacity: 0.25;

      animation:
        gridFloat 20s linear infinite;
    }


    .animated-scanline {

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 0%,
          rgba(255,255,255,0.03) 50%,
          transparent 100%
        );

      background-size:
        100% 220px;

      opacity: 0.13;

      mix-blend-mode:
        screen;

      animation:
        scanMove 7s linear infinite;
    }


    @keyframes bgDrift {

      0% {

        transform:
          translate3d(-2%, -1%, 0)
          scale(1.02)
          rotate(0deg);
      }

      50% {

        transform:
          translate3d(1.8%, 1.4%, 0)
          scale(1.08)
          rotate(6deg);
      }

      100% {

        transform:
          translate3d(-1%, 2%, 0)
          scale(1.04)
          rotate(-5deg);
      }
    }


    @keyframes bgHue {

      0% {

        filter:
          blur(32px)
          saturate(1.3)
          hue-rotate(0deg);
      }

      100% {

        filter:
          blur(32px)
          saturate(1.45)
          hue-rotate(360deg);
      }
    }


    @keyframes gridFloat {

      from {
        transform:
          translate3d(0,0,0);
      }

      to {
        transform:
          translate3d(64px,64px,0);
      }
    }


    @keyframes scanMove {

      from {
        transform:
          translateY(-220px);
      }

      to {
        transform:
          translateY(220px);
      }
    }


    /* ========================================================
       APP
       ======================================================== */

    .app {

      position: relative;

      z-index: 2;

      width: 100%;
      height: 100vh;

      display:
        flex;

      flex-direction:
        column;
    }


    /* ========================================================
       TOP BAR
       ======================================================== */

    .topbar {

      height: 66px;

      flex: none;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        0 20px;

      border-bottom:
        1px solid var(--line);

      background:
        rgba(5,11,8,0.72);

      backdrop-filter:
        blur(18px);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.12);

      animation:
        topbarIn .5s ease both;
    }


    @keyframes topbarIn {

      from {

        opacity: 0;

        transform:
          translateY(-16px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    .title-wrap {

      display:
        flex;

      align-items:
        center;

      gap: 11px;
    }


    .orb {

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background:
        var(--warn);

      box-shadow:
        0 0 18px
        rgba(255,213,106,0.7);

      transition:
        background .25s ease,
        box-shadow .25s ease,
        transform .3s ease;
    }


    .orb.online {

      background:
        var(--good);

      transform:
        scale(1.15);

      animation:
        orbPulse 2s ease-in-out infinite;
    }


    @keyframes orbPulse {

      0%,
      100% {

        box-shadow:
          0 0 12px
          rgba(141,240,160,0.55);
      }

      50% {

        box-shadow:
          0 0 24px
          rgba(141,240,160,0.95);
      }
    }


    .brand {

      display:
        flex;

      align-items:
        baseline;

      gap: 7px;
    }


    .title {

      font-weight: 900;

      letter-spacing:
        .06em;

      font-size:
        15px;
    }


    .version {

      color:
        var(--muted);

      font-size:
        11px;
    }


    .status-line {

      color:
        var(--muted);

      font-size:
        11px;

      margin-top:
        2px;
    }


    .top-actions {

      display:
        flex;

      gap:
        7px;
    }


    .icon-btn {

      width: 38px;
      height: 38px;

      border-radius:
        12px;

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.04);

      color:
        var(--text);

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .icon-btn:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.08);

      border-color:
        rgba(255,255,255,0.16);
    }


    /* ========================================================
       CHAT
       ======================================================== */

    .chat-shell {

      position:
        relative;

      flex:
        1;

      min-height:
        0;

      display:
        flex;

      justify-content:
        center;
    }


    .chat-column {

      width:
        min(920px,100%);

      height:
        100%;

      min-height:
        0;
    }


    .messages {

      width:
        100%;

      height:
        100%;

      overflow-y:
        auto;

      padding:
        30px 24px 220px;

      scroll-behavior:
        smooth;

      scrollbar-width:
        thin;

      scrollbar-color:
        rgba(255,255,255,.14)
        transparent;
    }


    .messages::-webkit-scrollbar {

      width:
        10px;
    }


    .messages::-webkit-scrollbar-thumb {

      background:
        rgba(255,255,255,0.12);

      border-radius:
        999px;

      border:
        2px solid transparent;

      background-clip:
        content-box;
    }


    /* ========================================================
       WELCOME
       ======================================================== */

    .welcome {

      min-height:
        calc(100vh - 270px);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      padding:
        40px 10px;

      animation:
        welcomeIn .7s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes welcomeIn {

      from {

        opacity: 0;

        transform:
          translateY(22px)
          scale(.98);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .welcome-orb {

      width: 72px;
      height: 72px;

      border-radius:
        24px;

      display:
        grid;

      place-items:
        center;

      color:
        #07210f;

      font-size:
        30px;

      font-weight:
        1000;

      background:
        linear-gradient(
          135deg,
          #adffc0,
          #65db89
        );

      box-shadow:
        0 20px 55px
        rgba(109,227,139,0.22);

      animation:
        welcomeOrb 2.8s ease-in-out infinite;
    }


    @keyframes welcomeOrb {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-5px);
      }
    }


    .welcome h1 {

      margin:
        22px 0 8px;

      font-size:
        clamp(30px,5vw,48px);

      letter-spacing:
        -.04em;
    }


    .welcome p {

      max-width:
        580px;

      margin:
        0;

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.65;
    }


    .welcome-suggestions {

      display:
        grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:
        10px;

      width:
        min(620px,100%);

      margin-top:
        24px;
    }


    .suggestion {

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.035);

      color:
        var(--text);

      border-radius:
        16px;

      padding:
        12px 14px;

      text-align:
        left;

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .suggestion:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.07);

      border-color:
        rgba(141,240,160,0.2);
    }


    .suggestion-title {

      font-size:
        12px;

      font-weight:
        800;
    }


    .suggestion-text {

      color:
        var(--muted);

      font-size:
        12px;

      line-height:
        1.4;

      margin-top:
        4px;
    }


    /* ========================================================
       MESSAGE ROWS
       ======================================================== */

    .message-row {

      display:
        flex;

      gap:
        14px;

      margin-bottom:
        28px;

      animation:
        messageIn .38s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes messageIn {

      from {

        opacity:
          0;

        transform:
          translateY(12px)
          scale(.99);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .message-row.user {

      justify-content:
        flex-end;
    }


    .message-row.greg {

      justify-content:
        flex-start;
    }


    .avatar {

      width: 32px;
      height: 32px;

      flex:
        none;

      border-radius:
        11px;

      display:
        grid;

      place-items:
        center;

      font-size:
        12px;

      font-weight:
        900;

      margin-top:
        2px;
    }


    .greg .avatar {

      background:
        linear-gradient(
          135deg,
          #a5ffb3,
          #68dc8c
        );

      color:
        #06210e;

      box-shadow:
        0 8px 20px
        rgba(109,227,139,.16);
    }


    .user .avatar {

      background:
        linear-gradient(
          135deg,
          #73d2ff,
          #4a92ff
        );

      color:
        #06121c;
    }


    .message-content {

      max-width:
        min(760px,calc(100% - 52px));

      min-width:
        0;
    }


    .message-name {

      font-size:
        11px;

      font-weight:
        800;

      color:
        var(--muted);

      margin-bottom:
        5px;
    }


    .message-text {

      white-space:
        pre-wrap;

      word-break:
        break-word;

      line-height:
        1.65;

      font-size:
        15px;
    }


    .user .message-content {

      padding:
        12px 15px;

      border-radius:
        18px;

      background:
        linear-gradient(
          180deg,
          rgba(84,199,255,.17),
          rgba(84,199,255,.08)
        );

      border:
        1px solid
        rgba(84,199,255,.20);
    }


    .user .message-name {

      display:
        none;
    }


    /* ========================================================
       THINKING DOTS
       ======================================================== */

    .typing-dots {

      display:
        inline-flex;

      gap:
        5px;

      padding-top:
        5px;
    }


    .typing-dots span {

      width:
        7px;

      height:
        7px;

      border-radius:
        50%;

      background:
        rgba(236,247,239,.7);

      animation:
        typingBounce 1s infinite ease-in-out;
    }


    .typing-dots span:nth-child(2) {

      animation-delay:
        .12s;
    }


    .typing-dots span:nth-child(3) {

      animation-delay:
        .24s;
    }


    @keyframes typingBounce {

      0%,
      80%,
      100% {

        transform:
          translateY(0);

        opacity:
          .45;
      }

      40% {

        transform:
          translateY(-5px);

        opacity:
          1;
      }
    }


    /* ========================================================
       TYPEWRITER CURSOR
       ======================================================== */

    .stream-cursor {

      display:
        inline-block;

      width:
        7px;

      height:
        18px;

      margin-left:
        4px;

      vertical-align:
        -3px;

      border-radius:
        2px;

      background:
        rgba(236,247,239,.8);

      animation:
        cursorBlink .85s steps(1) infinite;
    }


    @keyframes cursorBlink {

      50% {
        opacity:
          0;
      }
    }


    /* ========================================================
       CODE BLOCK
       ======================================================== */

    .code-block {

      width:
        100%;

      margin:
        13px 0;

      border:
        1px solid
        rgba(255,255,255,0.09);

      border-radius:
        15px;

      overflow:
        hidden;

      background:
        var(--code-bg);

      box-shadow:
        0 12px 28px
        rgba(0,0,0,0.22);

      transform-origin:
        top center;

      animation:
        codeBlockAppear
        .42s
        cubic-bezier(.16,1,.3,1)
        both;
    }


    /*
     * The block itself grows into place instead of simply
     * appearing instantly.
     */

    @keyframes codeBlockAppear {

      0% {

        opacity:
          0;

        transform:
          translateY(12px)
          scaleY(.78)
          scaleX(.985);

        filter:
          brightness(.7)
          blur(1px);
      }

      55% {

        opacity:
          1;

        transform:
          translateY(-2px)
          scaleY(1.015)
          scaleX(1);

        filter:
          brightness(1.08)
          blur(0);
      }

      100% {

        opacity:
          1;

        transform:
          translateY(0)
          scaleY(1)
          scaleX(1);

        filter:
          brightness(1)
          blur(0);
      }
    }


    /*
     * The header slides in a tiny bit after the box begins.
     */

    .code-header {

      min-height:
        38px;

      padding:
        0 10px 0 13px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;

      border-bottom:
        1px solid
        var(--code-line);

      background:
        var(--code-header);

      animation:
        codeHeaderIn
        .35s
        .06s
        ease both;
    }


    @keyframes codeHeaderIn {

      from {

        opacity:
          0;

        transform:
          translateY(-5px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    .code-language {

      color:
        #aab9b1;

      font-family:
        var(--mono);

      font-size:
        11px;

      font-weight:
        700;

      text-transform:
        lowercase;
    }


    .code-copy {

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.04);

      color:
        #c8d2cc;

      border-radius:
        8px;

      padding:
        5px 8px;

      cursor:
        pointer;

      font-size:
        11px;

      transition:
        background .12s ease,
        transform .12s ease;
    }


    .code-copy:hover {

      background:
        rgba(255,255,255,0.09);

      transform:
        translateY(-1px);
    }


    .code-content {

      overflow-x:
        auto;

      padding:
        14px;

      color:
        #d7e8dd;

      font-family:
        var(--mono);

      font-size:
        13px;

      line-height:
        1.6;

      white-space:
        pre;

      tab-size:
        4;

      animation:
        codeContentIn
        .38s
        .08s
        ease both;
    }


    @keyframes codeContentIn {

      from {

        opacity:
          0;

        transform:
          translateY(5px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    .code-content::-webkit-scrollbar {

      height:
        8px;
    }


    .code-content::-webkit-scrollbar-thumb {

      background:
        rgba(255,255,255,0.12);

      border-radius:
        999px;
    }


    /* ========================================================
       LIVE CODE BLOCK
       ======================================================== */

    .code-block.live {

      border-color:
        rgba(141,240,160,0.17);

      box-shadow:
        0 12px 28px
        rgba(0,0,0,0.22),
        0 0 0 1px
        rgba(141,240,160,0.035);
    }


    /* ========================================================
       COMPOSER
       ======================================================== */

    .composer-area {

      position:
        fixed;

      left:
        0;

      right:
        0;

      bottom:
        0;

      z-index:
        10;

      display:
        flex;

      justify-content:
        center;

      padding:
        0 20px 20px;

      pointer-events:
        none;
    }


    .composer-wrap {

      width:
        min(820px,100%);

      pointer-events:
        auto;

      position:
        relative;
    }


    .composer-glow {

      position:
        absolute;

      inset:
        -18px -35px -25px;

      background:
        radial-gradient(
          ellipse at center bottom,
          rgba(141,240,160,.13),
          transparent 65%
        );

      filter:
        blur(20px);

      pointer-events:
        none;
    }


    .composer {

      position:
        relative;

      border:
        1px solid
        rgba(255,255,255,.11);

      border-radius:
        24px;

      background:
        rgba(8,14,11,.90);

      backdrop-filter:
        blur(20px);

      box-shadow:
        0 22px 60px
        rgba(0,0,0,.4);

      padding:
        10px;

      animation:
        composerIn .65s cubic-bezier(.2,.8,.2,1) both;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
    }


    .composer:focus-within {

      border-color:
        rgba(141,240,160,.3);

      box-shadow:
        0 25px 70px rgba(0,0,0,.42),
        0 0 0 3px
        rgba(141,240,160,.05);

      transform:
        translateY(-1px);
    }


    @keyframes composerIn {

      from {

        opacity:
          0;

        transform:
          translateY(22px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }

    /* ========================================================

       ======================================================== */

    const canvas =
      document.getElementById(
        "bgCanvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    function resizeCanvas() {

      const dpr =
        Math.max(
          1,
          window.devicePixelRatio || 1
        );


      canvas.width =
        Math.floor(
          window.innerWidth *
          dpr
        );


      canvas.height =
        Math.floor(
          window.innerHeight *
          dpr
        );


      canvas.style.width =
        window.innerWidth +
        "px";


      canvas.style.height =
        window.innerHeight +
        "px";


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();


    const particles =
      Array.from(
        {
          length:
            42
        },
        () => ({

          x:
            Math.random() *
            window.innerWidth,

          y:
            Math.random() *
            window.innerHeight,

          r:
            18 +
            Math.random() *
            55,

          vx:
            (
              Math.random() -
              0.5
            ) *
            0.22,

          vy:
            (
              Math.random() -
              0.5
            ) *
            0.18,

          hue:
            Math.floor(
              Math.random() *
              360
            ),

          alpha:
            0.05 +
            Math.random() *
            0.18,

          pulse:
            Math.random() *
            Math.PI *
            2

        })
      );


    function drawCanvasBg() {

      const w =
        window.innerWidth;


      const h =
        window.innerHeight;


      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      const g =
        ctx.createLinearGradient(
          0,
          0,
          w,
          h
        );


      g.addColorStop(
        0,
        "rgba(10,18,14,0.10)"
      );


      g.addColorStop(
        1,
        "rgba(3,6,5,0.14)"
      );


      ctx.fillStyle =
        g;


      ctx.fillRect(
        0,
        0,
        w,
        h
      );


      ctx.save();


      ctx.globalCompositeOperation =
        "lighter";


      for (
        const p
        of particles
      ) {

        p.x +=
          p.vx;


        p.y +=
          p.vy;


        p.pulse +=
          0.018;


        if (
          p.x < -120
        ) {

          p.x =
            w + 120;

        }


        if (
          p.x > w + 120
        ) {

          p.x =
            -120;

        }


        if (
          p.y < -120
        ) {

          p.y =
            h + 120;

        }


        if (
          p.y > h + 120
        ) {

          p.y =
            -120;

        }


        const r =
          p.r +
          Math.sin(
            p.pulse
          ) *
          10;


        const grad =
          ctx.createRadialGradient(
            p.x,
            p.y,
            0,
            p.x,
            p.y,
            r
          );


        grad.addColorStop(
          0,
          `hsla(
            ${p.hue},
            95%,
            72%,
            ${p.alpha}
          )`
        );


        grad.addColorStop(
          0.45,
          `hsla(
            ${(p.hue + 40) % 360},
            95%,
            62%,
            ${p.alpha * 0.45}
          )`
        );


        grad.addColorStop(
          1,
          "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
          grad;


        ctx.beginPath();


        ctx.arc(
          p.x,
          p.y,
          r,
          0,
          Math.PI * 2
        );


        ctx.fill();

      }


      ctx.restore();


      requestAnimationFrame(
        drawCanvasBg
      );

    }


    requestAnimationFrame(

    /* ========================================================

    /* ========================================================

       ======================================================== */

    function loadState() {

      try {

        const raw =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!raw) {

          return {

            params:
              {
                ...DEFAULT_PARAMS
              },

            conversation:
              [],

            preset:
              "default"

          };

        }


        const parsed =
          JSON.parse(
            raw
          );


        return {

          params:
            {
              ...DEFAULT_PARAMS,
              ...(parsed.params || {})
            },

          conversation:
            Array.isArray(
              parsed.conversation
            )
              ? parsed.conversation
              : [],

          preset:
            parsed.preset ||
            "default"

        };

            [],

    /* ========================================================
       OLD TYPEWRITER
       ======================================================== */

    async function typeText(
      element,
      text,
      delay = 25
    ) {

      const chars =
        Array.from(
          String(text)
        );


      for (
        let i = 0;
        i < chars.length;
        i++
      ) {

        const ch =
          chars[i];


        element.textContent +=
          ch;


        let wait =
          delay;


        if (
          ch === " "
        ) {

          wait +=
            10;

        } else if (
          ch === ","
        ) {

          wait +=
            40;

        } else if (
          ch === "."
        ) {

          wait +=
            80;

        } else if (
          ch === "!"
        ) {

          wait +=
            90;

        } else if (
          ch === "?"
        ) {

          wait +=
            90;

        } else if (
          ch === "\n"
        ) {

          wait +=
            120;

        }


        await sleep(
          wait
        );

      }

    }


    /* ========================================================
       CODE BLOCK CREATOR
       ======================================================== */

    function createCodeBlock(
      language
    ) {

      const block =
        document.createElement(
          "div"
        );


      block.className =
        "code-block live";


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "code-header";


      const languageLabel =
        document.createElement(
          "span"
        );


      languageLabel.className =
        "code-language";


      languageLabel.textContent =
        language ||
        "code";


      const copyButton =
        document.createElement(
          "button"
        );


      copyButton.className =
        "code-copy";


      copyButton.type =
        "button";


      copyButton.textContent =
        "Copy";


      const codeContent =
        document.createElement(
          "div"
        );


      codeContent.className =
        "code-content";


      codeContent.textContent =
        "";


      copyButton.addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard.writeText(
              codeContent.textContent
            );


            copyButton.textContent =
              "Copied!";


            setTimeout(
              () =>
                copyButton.textContent =
                  "Copy",
              1200
            );


          } catch {

            copyButton.textContent =
              "Copy failed";


            setTimeout(
              () =>
                copyButton.textContent =
                  "Copy",
              1200
            );

          }

        }
      );


      header.appendChild(
        languageLabel
      );


      header.appendChild(
        copyButton
      );


      block.appendChild(
        header
      );


      block.appendChild(
        codeContent
      );


      return {

        block:
          block,

        languageLabel:
          languageLabel,

        codeContent:
          codeContent

      };

    }


    /* ========================================================
       STREAM PARSER
       ========================================================
       
       ```python
       starts code mode.

       ```
       ends code mode.

       Backticks are never shown.
       ======================================================== */

    function createStreamParser(
      stream
    ) {

      const parser = {

        mode:
          "text",

        pending:
          "",

        codeBlock:
          null,

        output:
          stream.output,

        normalQueue:
          Promise.resolve(),

        waitingForLanguage:
          false

      };


      /*
       * Normal text is typed asynchronously.
       * Incoming network data is NOT blocked by that typing.
       */

      function queueNormalText(
        text
      ) {

        if (
          !text
        ) {

          return;

        }


        parser.normalQueue =
          parser.normalQueue.then(
            () =>
              typeNormalText(
                text
              )
          );

      }


      async function typeNormalText(
        text
      ) {

        const span =
          document.createElement(
            "span"
          );


        span.className =
          "message-text";


        parser.output.appendChild(
          span
        );


        await typeText(
          span,
          text,
          25
        );


        scrollBottom(
          false
        );

      }


      function addCodeBlock(
        language
      ) {

        parser.codeBlock =
          createCodeBlock(
            language
          );


        parser.output.appendChild(
          parser.codeBlock.block
        );


        /*
         * The browser must have a layout frame before the
         * animation visibly starts, so force the animation
         * to begin after insertion.
         */

        requestAnimationFrame(
          () => {

            parser.codeBlock.block.style.willChange =
              "transform, opacity, filter";

          }
        );


        scrollBottom(
          false
        );

      }


      function appendCodeText(
        text
      ) {

        if (
          parser.codeBlock &&
          text
        ) {

          parser.codeBlock.codeContent.textContent +=
            text;


          scrollBottom(
            false
          );

        }

      }


      function closeCodeBlock() {

        if (
          parser.codeBlock
        ) {

          parser.codeBlock.block.classList.remove(
            "live"
          );


          parser.codeBlock.block.style.willChange =
            "auto";


          parser.codeBlock =
            null;

        }

      }


      /*
       * Feed any new network text.
       */

      async function feed(
        incoming
      ) {

        parser.pending +=
          incoming;


        while (
          parser.pending.length
        ) {


          /* ==================================================
             TEXT MODE
             ================================================== */

          if (
            parser.mode ===
            "text"
          ) {

            const marker =
              parser.pending.indexOf(
                "```"
              );


            if (
              marker === -1
            ) {

              /*
               * Hold two characters in case the next network
               * packet completes a split ``` marker.
               */

              if (
                parser.pending.length <= 2
              ) {

                return;

              }


              const safe =
                parser.pending.slice(
                  0,
                  -2
                );


              parser.pending =
                parser.pending.slice(
                  -2
                );


              queueNormalText(
                safe
              );


              return;

            }


            const before =
              parser.pending.slice(
                0,
                marker
              );


            if (
              before
            ) {

              queueNormalText(
                before
              );

            }


            parser.pending =
              parser.pending.slice(
                marker + 3
              );


            parser.mode =
              "language";


            continue;

          }


          /* ==================================================
             LANGUAGE MODE
             ================================================== */

          if (
            parser.mode ===
            "language"
          ) {

            const newline =
              parser.pending.indexOf(
                "\n"
              );


            if (
              newline === -1
            ) {

              return;

            }


            const language =
              parser.pending
                .slice(
                  0,
                  newline
                )
                .trim();


            parser.pending =
              parser.pending.slice(
                newline + 1
              );


            addCodeBlock(
              language
            );


            parser.mode =
              "code";


            continue;

          }


          /* ==================================================
             CODE MODE
             ================================================== */

          const marker =
            parser.pending.indexOf(
              "```"
            );


          if (
            marker === -1
          ) {

            if (
              parser.pending.length <= 2
            ) {

              return;

            }


            const safe =
              parser.pending.slice(
                0,
                -2
              );


            parser.pending =
              parser.pending.slice(
                -2
              );


            appendCodeText(
              safe
            );


            return;

          }


          const code =
            parser.pending.slice(
              0,
              marker
            );


          if (
            code
          ) {

            appendCodeText(
              code
            );

          }


          parser.pending =
            parser.pending.slice(
              marker + 3
            );


          closeCodeBlock();


          parser.mode =
            "text";

        }

      }


      async function finish() {

        if (
          parser.pending
        ) {

          if (
            parser.mode ===
            "text"
          ) {

            queueNormalText(
              parser.pending
            );

          } else if (
            parser.mode ===
            "code"
          ) {

            appendCodeText(
              parser.pending
            );

          } else if (
            parser.mode ===
            "language"
          ) {

            /*
             * If Greg strangely finishes directly after
             * ``` without a newline, treat the remainder as
             * the language name.
             */

            const language =
              parser.pending.trim();


            addCodeBlock(
              language ||
              "code"
            );


            closeCodeBlock();

          }


          parser.pending =
            "";

        }


        await parser.normalQueue;


        closeCodeBlock();

      }


      return {

        feed,

        finish

      };

    }


    /* ========================================================
       STREAM MESSAGE
       ======================================================== */

    async function streamMessage(
      userText
    ) {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          180000
        );


      const stream =
        createGregStream();


      const parser =
        createStreamParser(
          stream
        );


      let fullText =
        "";


      try {

        const response =
          await fetch(

            `${API_URL}/chat/stream`,

            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "application/json"
                },

              body:
                JSON.stringify({

                  message:
                    userText,

                  params:
                    state.params

                }),

              signal:
                controller.signal

            }

          );


        if (
          !response.ok
        ) {

          const errorText =
            await response.text();


          throw new Error(

            `HTTP ${
              response.status
            }: ${
              errorText ||
              "Request failed"
            }`

          );

        }


        if (
          !response.body
        ) {

          throw new Error(
            "Browser streaming is unavailable."
          );

        }


        const reader =
          response.body.getReader();


        const decoder =
          new TextDecoder(
            "utf-8"
          );


        while (true) {

          const {
            value,
            done
          } =
            await reader.read();


          if (
            done
          ) {

            break;

          }


          const chunk =
            decoder.decode(
              value,
              {
                stream:
                  true
              }
            );


          if (
            !chunk
          ) {

            continue;

          }


          fullText +=
            chunk;


          /*
           * IMPORTANT:
           *
           * Feed the network stream into the parser without
           * waiting for the letter-by-letter animation.
           *
           * This keeps the speed advantage you liked.
           */

          parser.feed(
            chunk
          );


          scrollBottom(
            false
          );

        }


        const finalChunk =
          decoder.decode();


        if (
          finalChunk
        ) {

          fullText +=
            finalChunk;


          parser.feed(
            finalChunk
          );

        }


        await parser.finish();


        if (
          stream.cursor &&
          stream.cursor.parentNode
        ) {

          stream.cursor.remove();

        }


        return fullText.trim();


      } finally {

        clearTimeout(
          timeout
        );


        await parser.finish()
          .catch(
            () => {}
          );


        if (
          stream.cursor &&
          stream.cursor.parentNode
        ) {

          stream.cursor.remove();

        }

      }

    }


    /* ========================================================
       STATIC MESSAGE
       ======================================================== */

    function createStaticCodeBlock(
      language,
      code
    ) {

      const codeBlock =
        createCodeBlock(
          language
        );


      codeBlock.block.classList.remove(
        "live"
      );


      codeBlock.codeContent.textContent =
        code;


      return codeBlock.block;

    }


    function renderStaticMessage(
      container,
      text
    ) {

      let cursor =
        0;


      while (
        cursor <
        text.length
      ) {

        const start =
          text.indexOf(
            "```",
            cursor
          );


        if (
          start === -1
        ) {

          const normal =
            text.slice(
              cursor
            );


          const span =
            document.createElement(
              "span"
            );


          span.className =
            "message-text";


          span.textContent =
            normal;


          container.appendChild(
            span
          );


          break;

        }


        if (
          start >
          cursor
        ) {

          const normal =
            text.slice(
              cursor,
              start
            );


          const span =
            document.createElement(
              "span"
            );


          span.className =
            "message-text";


          span.textContent =
            normal;


          container.appendChild(
            span
          );

        }


        const languageStart =
          start + 3;


        const languageEnd =
          text.indexOf(
            "\n",
            languageStart
          );


        if (
          languageEnd === -1
        ) {

          const span =
            document.createElement(
              "span"
            );


          span.textContent =
            text.slice(
              start
            );


          container.appendChild(
            span
          );


          break;

        }


        const language =
          text.slice(
            languageStart,
            languageEnd
          ).trim();


        const codeEnd =
          text.indexOf(
            "```",
            languageEnd + 1
          );


        if (
          codeEnd === -1
        ) {

          container.appendChild(

            createStaticCodeBlock(

              language,

              text.slice(
                languageEnd + 1
              )

            )

          );


          break;

        }


        const code =
          text.slice(
            languageEnd + 1,
            codeEnd
          );


        container.appendChild(

          createStaticCodeBlock(

            language,

            code

          )

        );


        cursor =
          codeEnd + 3;

      }

    }


    function addStaticGregMessage(
      text
    ) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row greg";


      row.innerHTML = `

        <div class="avatar">
          G
        </div>

        <div class="message-content">

          <div class="message-name">
            Greg
          </div>

          <div class="static-output"></div>

        </div>

      `;


      renderStaticMessage(

        row.querySelector(
          ".static-output"
        ),

        text

      );


      el.messages.appendChild(
        row
      );


      scrollBottom(
        false
      );


      return row;

    }


    /* ========================================================
       UPDATE UI
       ======================================================== */

    function updateUI() {

      el.statusLine.textContent =
        connected
          ? "Greg API connected"
          : "API offline";


      el.orb.classList.toggle(
        "online",
        connected
      );


      el.sendBtn.disabled =
        isSending;


      /*
       * NEVER disable the textbox.
       */

      el.input.disabled =
        false;


      if (
        isSending
      ) {

        el.memoryHint.textContent =
          "Greg is generating...";

      } else if (
        connected
      ) {

        el.memoryHint.textContent =
          `Preset: ${
            activePreset
              .charAt(0)
              .toUpperCase()
            +
            activePreset.slice(1)
          }`;

      } else {

        el.memoryHint.textContent =
          "Waiting for connection";

      }

    }


    /* ========================================================
       API TEST
       ======================================================== */

    async function testApi() {

      el.testBtn.disabled =
        true;


      const oldHint =
        el.memoryHint.textContent;


      el.memoryHint.textContent =
        "Testing connection...";


      try {

        const response =
          await fetch(

            `${API_URL}/chat`,

            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "application/json"
                },

              body:
                JSON.stringify({

                  message:
                    "ping",

                  params:
                    {

                      max_new_tokens:
                        1,

                      temperature:
                        0.01,

                      top_p:
                        0.01,

                      top_k:
                        1,

                      repetition_penalty:
                        1,

                      no_repeat_ngram_size:
                        0

                    }

                })

            }

          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        connected =
          true;


      } catch (error) {

        console.error(
          error
        );


        connected =
          false;

      } finally {

        el.testBtn.disabled =
          false;


        if (
          !isSending
        ) {

          el.memoryHint.textContent =
            connected
              ? `Preset: ${
                  activePreset
                    .charAt(0)
                    .toUpperCase()
                  +
                  activePreset.slice(1)
                }`
              : oldHint;

        }


        updateUI();

      }

    }


    /* ========================================================
       SEND MESSAGE
       ======================================================== */

    async function sendMessage() {

      const text =
        el.input.value.trim();


      if (
        !text ||
        isSending
      ) {

        return;

      }


      removeWelcome();


      el.input.value =
        "";


      resizeInput();


      addUserMessage(
        text
      );


      isSending =
        true;


      updateUI();


      saveState();


      const thinking =
        addThinkingMessage();


      try {

        await sleep(
          180
        );


        if (
          thinking &&
          thinking.parentNode
        ) {

          thinking.remove();

        }


        const reply =
          await streamMessage(
            text
          );


        state.conversation.push({

          role:
            "user",

          content:
            text

        });


        state.conversation.push({

          role:
            "assistant",

          content:
            reply

        });


        state.conversation =
          state.conversation.slice(
            -24
          );


        saveState();


        connected =
          true;


      } catch (error) {

        console.error(
          error
        );


        if (
          thinking &&
          thinking.parentNode
        ) {

          thinking.remove();

        }


        connected =
          false;


        const errorMessage =
          error &&
          error.name ===
          "AbortError"

            ? "Request timed out."

            : "Uh Oh! Server is having problems";


        addStaticGregMessage(
          errorMessage
        );

      } finally {

        isSending =
          false;


        updateUI();


        el.input.focus();

      }

    }


    /* ========================================================
       PRESETS
       ======================================================== */

    function updatePresetUI() {

      const labels = {

        default:
          "Default",

        fast:
          "Fast",

        smart:
          "Smart"

      };


      el.presetButtonText.textContent =
        labels[
          activePreset
        ] ||
        "Default";


      document
        .querySelectorAll(
          ".preset-option"
        )
        .forEach(
          button => {

            const active =
              button.dataset.preset ===
              activePreset;


            button.classList.toggle(
              "active",
              active
            );


            const check =
              button.querySelector(
                ".preset-check"
              );


            if (
              check
            ) {

              check.textContent =
                active
                  ? "✓"
                  : "";

            }

          }
        );

    }


    function setPreset(
      preset
    ) {

      if (
        !PRESET_PARAMS[preset]
      ) {

        preset =
          "default";

      }


      activePreset =
        preset;


      state.preset =
        preset;


      state.params =
        {
          ...PRESET_PARAMS[preset]
        };


      saveState();


      updatePresetUI();


      el.presetMenu.classList.remove(
        "open"
      );


      el.memoryHint.textContent =
        `Preset: ${
          preset
            .charAt(0)
            .toUpperCase()
          +
          preset.slice(1)
        }`;

    }


    el.presetButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        el.presetMenu.classList.toggle(
          "open"
        );

      }
    );


    document.addEventListener(
      "click",
      event => {

        if (
          !el.presetMenu.contains(
            event.target
          ) &&
          event.target !==
          el.presetButton
        ) {

          el.presetMenu.classList.remove(
            "open"
          );

        }

      }
    );


    document
      .querySelectorAll(
        ".preset-option"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () =>
              setPreset(
                button.dataset.preset
              )
          );

        }
      );


    updatePresetUI();


    /* ========================================================
       CLEAR CHAT
       ======================================================== */

    function clearChat() {

      if (
        !confirm(
          "Clear this single chat?"
        )
      ) {

        return;

      }


      state.conversation =
        [];


      saveState();


      el.messages.innerHTML =
        "";


      showWelcome();


      el.input.focus();

    }


    /* ========================================================
       EXPORT
       ======================================================== */

    function exportChat() {

      const blob =
        new Blob(

          [
            JSON.stringify(
              state,
              null,
              2
            )
          ],

          {
            type:
              "application/json"
          }

        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        "greg_chat_state.json";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      URL.revokeObjectURL(
        url
      );

    }


    /* ========================================================
       REPLAY CHAT
       ======================================================== */

    function replayConversation() {

      el.messages.innerHTML =
        "";


      if (
        state.conversation.length ===
        0
      ) {

        showWelcome();

        return;

      }


      for (
        const item
        of state.conversation
      ) {

        if (
          item.role ===
          "user"
        ) {

          addUserMessage(
            item.content
          );

        } else if (
          item.role ===
          "assistant"
        ) {

          addStaticGregMessage(
            item.content
          );

        }

      }


      scrollBottom(
        false
      );

    }


    /* ========================================================
       INPUT
       ======================================================== */

    el.input.addEventListener(
      "input",
      resizeInput
    );


    el.input.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ========================================================
       BUTTONS
       ======================================================== */

    el.sendBtn.addEventListener(
      "click",
      sendMessage
    );


    el.testBtn.addEventListener(
      "click",
      testApi
    );


    el.clearBtn.addEventListener(
      "click",
      clearChat
    );


    el.exportBtn.addEventListener(
      "click",
      exportChat
    );


    /* ========================================================
       STARTUP
       ======================================================== */

    replayConversation();

    updateUI();

    resizeInput();


    /*
     * API test does not disable the textbox.
     */

    setTimeout(
      testApi,
      500
    );


    setTimeout(
      () => {

        el.input.focus();

      },
      700
    );

  </script>
