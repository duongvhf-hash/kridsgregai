       ======================================================== */

    async function typeText(
      element,
      text,
      delay = 5
    ) {

      const chars =
        Array.from(
          String(text)
        );


      for (
        let i = 0;
        i < chars.length;
        i++
      ) {

        const ch =
          chars[i];


        element.textContent +=
          ch;


        let wait =
          delay;


        if (
          ch === " "
        ) {

          wait +=
            10;

        } else if (
          ch === ","
        ) {

          wait +=
            40;

        } else if (
          ch === "."
        ) {

          wait +=
            80;

        } else if (
          ch === "!"
        ) {

          wait +=
            90;

        } else if (
          ch === "?"
        ) {

          wait +=
            90;

        } else if (
          ch === "\n"
        ) {

          wait +=
            120;

        }


        await sleep(
          wait
        );

      }

    }

    function downloadTextCode(
      filename,
      code,
      language
    ) {

      const extension =
        filename &&
        filename.includes(
          "."
        )
          ? filename
          : (
              filename ||
              (
                language ||
                "txt"
              )
            );


      const blob =
        new Blob(
          [
            code
          ],
          {
            type:
              "text/plain;charset=utf-8"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const anchor =
        document.createElement(
          "a"
        );


      anchor.href =
        url;


      anchor.download =
        extension;


      document.body.appendChild(
        anchor
      );


      anchor.click();


      anchor.remove();


      setTimeout(
        () => {

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );

    }

        block
      );


      shell.appendChild(
        inner
      );


      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              shell.classList.add(
                "open"
              );

            }
          );

        }
      );


      return {

        shell,
        block,
        codeContent,
        languageLabel,
        filename:
          filename ||
          null

      };

    }


    /* ========================================================
       ORDERED RENDER QUEUE
       ======================================================== */

    class OrderedRenderer {

      constructor(
        stream
      ) {

        this.stream =
          stream;

        this.queue =
          [];

        this.running =
          false;

        this.finished =
          false;

        this.waiter =
          null;

        this.code =
          null;

        this.textElement =
          null;

      }


      enqueue(
        operation
      ) {

        this.queue.push(
          operation
        );


        this.wake();

        this.run();

      }


      wake() {

        if (
          this.waiter
        ) {

          const resolve =
            this.waiter;

          this.waiter =
            null;

          resolve();

        }

      }


      async waitForQueue() {

        if (
          this.queue.length
        ) {

          return;

        }


        if (
          this.finished
        ) {

          return;

        }


        await new Promise(
          resolve => {

            this.waiter =
              resolve;

          }
        );

      }


      async run() {

        if (
          this.running
        ) {

          return;

        }


        this.running =
          true;


        try {

          while (
            !this.finished ||
            this.queue.length
          ) {

            if (
              !this.queue.length
            ) {

              await this.waitForQueue();

              continue;

            }


            const operation =
              this.queue.shift();


            await this.renderOperation(
              operation
            );

          }

        } finally {

          this.running =
            false;

        }

      }


      async renderOperation(
        operation
      ) {

        if (
          operation.type ===
          "text"
        ) {

          await this.renderText(
            operation.text
          );

          return;

        }


        if (
          operation.type ===
          "code-open"
        ) {

          await this.renderCodeOpen(
            operation.language
          );

          return;

        }


        if (
          operation.type ===
          "code-text"
        ) {

          this.renderCodeText(
            operation.text
          );

          return;

        }


        if (
          operation.type ===
          "code-close"
        ) {

          this.renderCodeClose();

          return;

        }


        if (
          operation.type ===
          "generated-file"
        ) {

          addGeneratedFileToStream(

            this.stream,

            operation.file

          );

          return;

        }

      }


      async renderText(
        text
      ) {

        if (
          !text
        ) {

          return;

        }


        const span =
          document.createElement(
            "span"
          );


        span.className =
          "message-text";


        this.stream.output.appendChild(
          span
        );


        this.textElement =
          span;


        await typeText(
          span,
          text,
          25
        );


        scrollBottom(
          false
        );

      }


      async renderCodeOpen(
        language
      ) {

        const code =
          createCodeBlock(
            language
          );


        this.stream.output.appendChild(
          code.shell
        );


        this.code =
          code;


        scrollBottom(
          false
        );


        await sleep(
          30
        );

      }


      renderCodeText(
        text
      ) {

        if (
          !this.code ||
          !text
        ) {

          return;

        }


        this.code.codeContent.textContent +=
          text;


        scrollBottom(
          false
        );

      }


      renderCodeClose() {

        if (
          !this.code
        ) {

          return;

        }


        this.code.block.classList.remove(
          "live"
        );


        this.code =
          null;


        scrollBottom(
          false
        );

      }


      async finish() {

        this.finished =
          true;


        this.wake();


        while (
          this.running ||
          this.queue.length
        ) {

          await sleep(
            10
          );

        }

      }

    }


    /* ========================================================
       STREAM PARSER
       ======================================================== */

    class StreamParser {

      constructor(
        renderer
      ) {

        this.renderer =
          renderer;

        this.mode =
          "text";

        this.pending =
          "";

        this.finished =
          false;

      }


      feed(
        incoming
      ) {

        if (
          !incoming ||
          this.finished
        ) {

          return;

        }


        this.pending +=
          incoming;


        this.process();

      }


      process() {

        while (
          this.pending.length
        ) {

          if (
            this.mode ===
            "text"
          ) {

            const markerIndex =
              this.pending.indexOf(
                "```"
              );


            if (
              markerIndex ===
              -1
            ) {

              if (
                this.pending.length <=
                2
              ) {

                return;

              }


              const safeText =
                this.pending.slice(
                  0,
                  this.pending.length - 2
                );


              this.pending =
                this.pending.slice(
                  -2
                );


              this.renderer.enqueue({

                type:
                  "text",

                text:
                  safeText

              });


              continue;

            }


            const textBefore =
              this.pending.slice(
                0,
                markerIndex
              );


            if (
              textBefore
            ) {

              this.renderer.enqueue({

                type:
                  "text",

                text:
                  textBefore

              });

            }


            this.pending =
              this.pending.slice(
                markerIndex + 3
              );


            this.mode =
              "language";


            continue;

          }


          if (
            this.mode ===
            "language"
          ) {

            const newlineIndex =
              this.pending.indexOf(
                "\n"
              );


            if (
              newlineIndex ===
              -1
            ) {

              return;

            }


            const language =
              this.pending
                .slice(
                  0,
                  newlineIndex
                )
                .trim();


            this.pending =
              this.pending.slice(
                newlineIndex + 1
              );


            this.renderer.enqueue({

              type:
                "code-open",

              language:
                language ||
                "code"

            });


            this.mode =
              "code";


            continue;

          }


          if (
            this.mode ===
            "code"
          ) {

            const markerIndex =
              this.pending.indexOf(
                "```"
              );


            if (
              markerIndex ===
              -1
            ) {

              if (
                this.pending.length <=
                2
              ) {

                return;

              }


              const safeCode =
                this.pending.slice(
                  0,
                  this.pending.length - 2
                );


              this.pending =
                this.pending.slice(
                  -2
                );


              this.renderer.enqueue({

                type:
                  "code-text",

                text:
                  safeCode

              });


              continue;

            }


            const codeBefore =
              this.pending.slice(
                0,
                markerIndex
              );


            if (
              codeBefore
            ) {

              this.renderer.enqueue({

                type:
                  "code-text",

                text:
                  codeBefore

              });

            }


            this.pending =
              this.pending.slice(
                markerIndex + 3
              );


            this.renderer.enqueue({

              type:
                "code-close"

            });


            this.mode =
              "text";


            continue;

          }

        }

      }


      finish() {

        if (
          this.finished
        ) {

          return;

        }


        if (
          this.pending
        ) {

          if (
            this.mode ===
            "text"
          ) {

            this.renderer.enqueue({

              type:
                "text",

              text:
                this.pending

            });

          } else if (
            this.mode ===
            "code"
          ) {

            this.renderer.enqueue({

              type:
                "code-text",

              text:
                this.pending

            });

          } else if (
            this.mode ===
            "language"
          ) {

            this.renderer.enqueue({

              type:
                "text",

              text:
                "```" +
                this.pending

            });

          }

        }


        this.pending =
          "";

        this.finished =
          true;

      }

    }


    /* ========================================================
       GREG FILE PROTOCOL
       ======================================================== */

    function processGregFileStreamChunk(
      chunk,
      parser,
      stream
    ) {

      if (
        !chunk
      ) {

        return;

      }


      if (
        stream.fileMode
      ) {

        stream.fileBuffer +=
          chunk;


        while (
          true
        ) {

          const endIndex =
            stream.fileBuffer.indexOf(
              "[/GREG_FILE]"
            );


          if (
            endIndex ===
            -1
          ) {

            if (
              stream.fileBuffer.length >
              1000000
            ) {

              stream.fileMode =
                false;


              processThinkingStream(

                "[The generated file was too large.]",

                parser,

                stream

              );


              stream.fileBuffer =
                "";


              return;

            }


            return;

          }


          const jsonText =
            stream.fileBuffer.slice(
              0,
              endIndex
            ).trim();


          stream.fileBuffer =
            stream.fileBuffer.slice(
              endIndex +
              "[/GREG_FILE]".length
            );


          try {

            const file =
              JSON.parse(
                jsonText
              );


            if (
              file
              &&
              typeof file ===
              "object"
            ) {

              stream.generatedFiles.push(
                file
              );


              parser.renderer.enqueue({

                type:
                  "generated-file",

                file:
                  file

              });

            }

          } catch (
            error
          ) {

            console.error(
              "Could not parse GREG_FILE:",
              error
            );


            processThinkingStream(

              "[Greg generated an invalid file block.]",

              parser,

              stream

            );

          }


          stream.fileMode =
            false;


          if (
            stream.fileBuffer
          ) {

            processGregFileStreamChunk(

              stream.fileBuffer,

              parser,

              stream

            );

            stream.fileBuffer =
              "";

          }


          return;

        }

      }


      stream.fileBuffer +=
        chunk;


      const fileStart =
        stream.fileBuffer.indexOf(
          "[GREG_FILE]"
        );


      if (
        fileStart ===
        -1
      ) {

        const keepLength =
          "[GREG_FILE]".length - 1;


        if (
          stream.fileBuffer.length <=
          keepLength
        ) {

          return;

        }


        const safeLength =
          stream.fileBuffer.length -
          keepLength;


        const safeText =
          stream.fileBuffer.slice(
            0,
            safeLength
          );


        stream.fileBuffer =
          stream.fileBuffer.slice(
            safeLength
          );


        processThinkingStream(

          safeText,

          parser,

          stream

        );


        return;

      }


      const answerBeforeFile =
        stream.fileBuffer.slice(
          0,
          fileStart
        );


      if (
        answerBeforeFile
      ) {

        processThinkingStream(

          answerBeforeFile,

          parser,

          stream

        );

      }


      stream.fileBuffer =
        stream.fileBuffer.slice(

          fileStart +
          "[GREG_FILE]".length

        );


      stream.fileMode =
        true;


      if (
        stream.fileBuffer
      ) {

        const current =
          stream.fileBuffer;


        stream.fileBuffer =
          "";


        processGregFileStreamChunk(

          current,

          parser,

          stream

        );

      }

    }


    function finishGregFileStream(
      parser,
      stream
    ) {

      if (
        stream.fileMode
      ) {

        processThinkingStream(

          "[Incomplete generated file block.]",

          parser,

          stream

        );


        stream.fileMode =
          false;


        stream.fileBuffer =
          "";

        return;

      }


      if (
        stream.fileBuffer
      ) {

        processThinkingStream(

          stream.fileBuffer,

          parser,

          stream

        );


        stream.fileBuffer =
          "";

      }

    }


    /* ========================================================
       SERVER METADATA
       ======================================================== */

    function processStreamChunkWithMetadata(
      chunk,
      parser,
      stream
    ) {

      if (
        !chunk
      ) {

        return;

      }


      if (
        stream.metaFound
      ) {

        stream.metaBuffer +=
          chunk;

        return;

      }


      stream.metaScanBuffer +=
        chunk;


      const markerIndex =
        stream.metaScanBuffer.indexOf(
          META_MARKER
        );


      if (
        markerIndex ===
        -1
      ) {

        const keepLength =
          META_MARKER.length - 1;


        if (
          stream.metaScanBuffer.length <=
          keepLength
        ) {

          processGregFileStreamChunk(

            stream.metaScanBuffer,

            parser,

            stream

          );


          stream.metaScanBuffer =
            "";

          return;

        }


        const safeLength =
          stream.metaScanBuffer.length -
          keepLength;


        const safeText =
          stream.metaScanBuffer.slice(
            0,
            safeLength
          );


        stream.metaScanBuffer =
          stream.metaScanBuffer.slice(
            safeLength
          );


        processGregFileStreamChunk(

          safeText,

          parser,

          stream

        );


        return;

      }


      const answerBeforeMetadata =
        stream.metaScanBuffer.slice(
          0,
          markerIndex
        );


      if (
        answerBeforeMetadata
      ) {

        processGregFileStreamChunk(

          answerBeforeMetadata,

          parser,

          stream

        );

      }


      stream.metaFound =
        true;


      stream.metaBuffer =
        stream.metaScanBuffer.slice(

          markerIndex +
          META_MARKER.length

        );


      stream.metaScanBuffer =
        "";

    }


    function finishStreamMetadata(
      parser,
      stream
    ) {

      if (
        !stream.metaFound
      ) {

        if (
          stream.metaScanBuffer
        ) {

          processGregFileStreamChunk(

            stream.metaScanBuffer,

            parser,

            stream

          );

        }


        stream.metaScanBuffer =
          "";


        finishGregFileStream(
          parser,
          stream
        );


        return;

      }


      try {

        const metadata =
          JSON.parse(

            stream.metaBuffer.trim()

          );


        if (
          metadata &&
          typeof metadata ===
          "object"
        ) {

          stream.imageDescription =

            typeof metadata.image_description ===
            "string"

              ? metadata.image_description.trim()

              : null;


          stream.imageCount =
            Number(
              metadata.image_count || 0
            );


          stream.files =
            Array.isArray(
              metadata.files
            )
              ? metadata.files
              : [];

        }

      } catch (
        error
      ) {

        console.error(
          "Could not parse Greg image/file metadata:",
          error
        );

      }


      finishGregFileStream(
        parser,
        stream
      );

    }


    /* ========================================================
       STREAM MESSAGE
       ======================================================== */

    async function streamMessage(
      userText,
      images = [],
      files = []
    ) {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          180000
        );


      const stream =
        createGregStream();


      const renderer =
        new OrderedRenderer(
          stream
        );


      const parser =
        new StreamParser(
          renderer
        );


      /*
       * ONLY the latest 80 messages go to Greg.
       *
       * Saved image descriptions are included.
       *
       * Old actual image files are NOT sent again.
       */

      const recentMessages =
        state.conversation

          .slice(
            -MEMORY_LIMIT
          )

          .map(
            item => {

              const speaker =
                item.role ===
                "user"
                  ? "User"
                  : "Greg";


              let result =
                `${speaker}: ${
                  item.content || ""
                }`;


              if (
                item.role ===
                "user" &&
                item.imageDescription
              ) {

                result +=

                  "\n[Visual information from "
                  +
                  "images attached to this earlier "
                  +
                  "message:]\n"
                  +
                  item.imageDescription;

              }


              if (
                item.role ===
                "user" &&
                Array.isArray(
                  item.files
                ) &&
                item.files.length
              ) {

                result +=

                  "\n[Files attached to this earlier "
                  +
                  "message:]\n"
                  +
                  item.files
                    .map(
                      file =>
                        `File ${
                          file.index || 1
                        } — ${
                          file.fileType ||
                          "FILE"
                        } — ${
                          file.name ||
                          "file"
                        }`
                    )
                    .join(
                      "\n"
                    );

              }


              return result;

            }
          )

          .join(
            "\n\n"
          );


      const imagePayload =
        [];


      const filePayload =
        files.map(
          file => ({

            name:
              file.name,

            type:
              file.type,

            data_url:
              file.dataUrl

          })
        );


      try {

        const response =
          await fetch(

            `${API_URL}/chat/stream`,

            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "application/json"
                },

              body:
                JSON.stringify({

                  message:
                    userText,

                  memory:
                    recentMessages,

                  params:
                    state.params,

                  images:
                    imagePayload,

                  files:
                    filePayload

                }),

              signal:
                controller.signal

            }

          );


        if (
          !response.ok
        ) {

          const errorText =
            await response.text();


          throw new Error(

            `HTTP ${response.status}: ${
              errorText ||
              "Request failed"
            }`

          );

        }


        if (
          !response.body
        ) {

          throw new Error(
            "Browser streaming is unavailable."
          );

        }


        const reader =
          response.body.getReader();


        const decoder =
          new TextDecoder(
            "utf-8"
          );


        while (
          true
        ) {

          const result =
            await reader.read();


          if (
            result.done
          ) {

            break;

          }


          const chunk =
            decoder.decode(

              result.value,

              {
                stream:
                  true
              }

            );


          if (
            !chunk
          ) {

            continue;

          }


          processStreamChunkWithMetadata(

            chunk,

            parser,

            stream

          );


          scrollBottom(
            false
          );

        }


        const finalChunk =
          decoder.decode();


        if (
          finalChunk
        ) {

          processStreamChunkWithMetadata(

            finalChunk,

            parser,

            stream

          );

        }


        finishStreamMetadata(

          parser,

          stream

        );


        finishThinkingStream(

          parser,

          stream

        );


        parser.finish();


        await renderer.finish();


        finishThinkingUI(
          stream
        );


        if (
          stream.cursor &&
          stream.cursor.parentNode
        ) {

          stream.cursor.remove();

        }


        return {

          answer:
            stream.answerText.trim(),

          imageDescription:
            stream.imageDescription,

          imageCount:
            stream.imageCount,

          files:
            stream.files,

          generatedFiles:
            stream.generatedFiles

        };


      } finally {

        clearTimeout(
          timeout
        );


        finishThinkingUI(
          stream
        );


        parser.finish();


        await renderer.finish()
          .catch(
            () => {}
          );


        if (
          stream.cursor &&
          stream.cursor.parentNode
        ) {

          stream.cursor.remove();

        }

      }

    }


    /* ========================================================
       STATIC CODE BLOCK
       ======================================================== */

    function createStaticCodeBlock(
      language,
      code
    ) {

      const codeBlock =
        createCodeBlock(
          language
        );


      codeBlock.shell.classList.add(
        "open"
      );


      codeBlock.block.classList.remove(
        "live"
      );


      codeBlock.codeContent.textContent =
        code;


      return codeBlock.shell;

    }


    /* ========================================================
       STATIC MESSAGE RENDERER
       ======================================================== */

    function renderStaticMessage(
      container,
      text
    ) {

      let cursor =
        0;


      while (
        cursor <
        text.length
      ) {

        const fileStart =
          text.indexOf(
            "[GREG_FILE]",
            cursor
          );


        const start =
          text.indexOf(
            "```",
            cursor
          );


        if (
          fileStart !==
          -1 &&
          (
            start ===
            -1 ||
            fileStart <
            start
          )
        ) {

          if (
            fileStart >
            cursor
          ) {

            const normal =
              text.slice(
                cursor,
                fileStart
              );


            const span =
              document.createElement(
                "span"
              );


            span.className =
              "message-text";


            span.textContent =
              normal;


            container.appendChild(
              span
            );

          }


          const fileEnd =
            text.indexOf(
              "[/GREG_FILE]",
              fileStart
            );


          if (
            fileEnd ===
            -1
          ) {

            break;

          }


          try {

            const file =
              JSON.parse(

                text.slice(

                  fileStart +
                  "[GREG_FILE]".length,

                  fileEnd

                ).trim()

              );


            const list =
              document.createElement(
                "div"
              );


            list.className =
              "generated-file-list";


            list.appendChild(
              createGeneratedFileCard(
                file
              )
            );


            container.appendChild(
              list
            );

          } catch {

          }


          cursor =
            fileEnd +
            "[/GREG_FILE]".length;


          continue;

        }


        if (
          start ===
          -1
        ) {

          const normal =
            text.slice(
              cursor
            );


          if (
            normal
          ) {

            const span =
              document.createElement(
                "span"
              );


            span.className =
              "message-text";


            span.textContent =
              normal;


            container.appendChild(
              span
            );

          }


          break;

        }


        if (
          start >
          cursor
        ) {

          const normal =
            text.slice(
              cursor,
              start
            );


          const span =
            document.createElement(
              "span"
            );


          span.className =
            "message-text";


          span.textContent =
            normal;


          container.appendChild(
            span
          );

        }


        const languageStart =
          start + 3;


        const languageEnd =
          text.indexOf(
            "\n",
            languageStart
          );


        if (
          languageEnd ===
          -1
        ) {

          const literal =
            document.createElement(
              "span"
            );


          literal.className =
            "message-text";


          literal.textContent =
            text.slice(
              start
            );


          container.appendChild(
            literal
          );


          break;

        }


        const language =
          text.slice(
            languageStart,
            languageEnd
          ).trim();


        const codeEnd =
          text.indexOf(
            "```",
            languageEnd + 1
          );


        if (
          codeEnd ===
          -1
        ) {

          container.appendChild(

            createStaticCodeBlock(

              language ||
              "code",

              text.slice(
                languageEnd + 1
              )

            )

          );


          break;

        }


        const code =
          text.slice(

            languageEnd + 1,

            codeEnd

          );


        container.appendChild(

          createStaticCodeBlock(

            language ||
            "code",

            code

          )

        );


        cursor =
          codeEnd + 3;

      }

    }


    /* ========================================================
       STATIC GREG MESSAGE
       ======================================================== */

    function addStaticGregMessage(
      text
    ) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row greg";


      row.innerHTML = `

        <div class="avatar">
          G
        </div>

        <div class="message-content">

          <div class="message-name">
            Greg
          </div>

          <div class="static-output"></div>

        </div>

      `;


      renderStaticMessage(

        row.querySelector(
          ".static-output"
        ),

        text

      );


      el.messages.appendChild(
        row
      );


      scrollBottom(
        false
      );


      return row;

    }


    /* ========================================================
       UPDATE UI
       ======================================================== */

    function updateUI() {

      el.statusLine.textContent =
        connected
          ? "Greg API connected"
          : "API offline";


      el.orb.classList.toggle(
        "online",
        connected
      );


      el.sendBtn.disabled =
        isSending;


      el.input.disabled =
        false;


      if (
        isSending
      ) {

        el.memoryHint.textContent =
          "Greg is generating...";

      } else if (
        connected
      ) {

        el.memoryHint.textContent =
          `Preset: ${
            activePreset
              .charAt(0)
              .toUpperCase()
            +
            activePreset.slice(1)
          }`;

      } else {

        el.memoryHint.textContent =
          "Waiting for connection";

      }

    }


    /* ========================================================
       API TEST
       ======================================================== */

    async function testApi() {

      el.testBtn.disabled =
        true;


      const oldHint =
        el.memoryHint.textContent;


      el.memoryHint.textContent =
        "Testing connection...";


      try {

        const response =
          await fetch(

            `${API_URL}/chat`,

            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "application/json"
                },

              body:
                JSON.stringify({

                  message:
                    "ping",

                  params:
                    {

                      max_new_tokens:
                        1,

                      temperature:
                        0.01,

                      top_p:
                        0.01,

                      top_k:
                        1,

                      repetition_penalty:
                        1,

                      no_repeat_ngram_size:
                        0

                    }

                })

            }

          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        connected =
          true;


      } catch (
        error
      ) {

        console.error(
          error
        );


        connected =
          false;

      } finally {

        el.testBtn.disabled =
          false;


        if (
          !isSending
        ) {

          el.memoryHint.textContent =
            connected
              ? `Preset: ${
                  activePreset
                    .charAt(0)
                    .toUpperCase()
                  +
                  activePreset.slice(1)
                }`
              : oldHint;

        }


        updateUI();

      }

    }


    /* ========================================================
       SEND MESSAGE
       ======================================================== */

    async function sendMessage() {

      const text =
        el.input.value.trim();


      if (

        (
          !text &&
          !pendingFiles.length
        )

        ||

        isSending

      ) {

        return;

      }


      removeWelcome();


      const imagesForMessage =
        cloneImagesForStorage(
          pendingImages
        );


      const filesForMessage =
        cloneFilesForStorage(
          pendingFiles
        );


      const currentFiles =
        pendingFiles.map(
          file => ({
            ...file
          })
        );


      el.input.value =
        "";


      resizeInput();


      addUserMessage(

        text,

        imagesForMessage,

        filesForMessage

      );


      pendingImages =
        [];


      pendingFiles =
        [];


      renderImagePreviews();

      renderFilePreviews();


      isSending =
        true;


      updateUI();


      saveState();


      const thinking =
        addThinkingMessage();


      try {

        await sleep(
          180
        );


        if (
          thinking &&
          thinking.parentNode
        ) {

          thinking.remove();

        }


        const result =
          await streamMessage(

            text,

            imagesForMessage,

            currentFiles

          );


        state.conversation.push({

          role:
            "user",

          content:
            text,

          images:
            imagesForMessage,

          files:
            filesForMessage,

          imageDescription:
            result.imageDescription ||
            null

        });


        state.conversation.push({

          role:
            "assistant",

          content:
            result.answer,

          images:
            [],

          files:
            [],

          imageDescription:
            null

        });


        state.conversation =
          state.conversation.slice(
            -80
          );


        saveState();


        connected =
          true;


      } catch (
        error
      ) {

        console.error(
          error
        );


        if (
          thinking &&
          thinking.parentNode
        ) {

          thinking.remove();

        }


        connected =
          false;


        const errorMessage =
          error &&
          error.name ===
          "AbortError"

            ? "Request timed out."

            : "Uh Oh! Server is having problems";


        addStaticGregMessage(
          errorMessage
        );

      } finally {

        isSending =
          false;


        updateUI();


        el.input.focus();

      }

    }


    /* ========================================================
       PRESETS
       ======================================================== */

    function updatePresetUI() {

      const labels = {

        default:
          "Default",

        fast:
          "Fast",

        smart:
          "Smart"

      };


      el.presetButtonText.textContent =
        labels[
          activePreset
        ] ||
        "Default";


      document
        .querySelectorAll(
          ".preset-option"
        )
        .forEach(
          button => {

            const active =
              button.dataset.preset ===
              activePreset;


            button.classList.toggle(
              "active",
              active
            );


            const check =
              button.querySelector(
                ".preset-check"
              );


            if (
              check
            ) {

              check.textContent =
                active
                  ? "✓"
                  : "";

            }

          }
        );

    }


    function setPreset(
      preset
    ) {

      if (
        !PRESET_PARAMS[preset]
      ) {

        preset =
          "default";

      }


      activePreset =
        preset;


      state.preset =
        preset;


      state.params =
        {
          ...PRESET_PARAMS[preset]
        };


      saveState();


      updatePresetUI();


      el.presetMenu.classList.remove(
        "open"
      );


      el.memoryHint.textContent =
        `Preset: ${
          preset
            .charAt(0)
            .toUpperCase()
          +
          preset.slice(1)
        }`;

    }


    /* ========================================================
       ATTACH MENU
       ======================================================== */

    el.attachButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        el.attachMenu.classList.toggle(
          "open"
        );


        el.attachButton.classList.toggle(
          "open"
        );


        el.presetMenu.classList.remove(
          "open"
        );

      }
    );


    el.uploadImageOption.addEventListener(
      "click",
      () => {

        el.imageInput.click();

      }
    );


    el.uploadFileOption.addEventListener(
      "click",
      () => {

        el.fileInput.click();

      }
    );


    el.imageInput.addEventListener(
      "change",
      event => {

        addImageFiles(
          event.target.files
        );

      }
    );


    el.fileInput.addEventListener(
      "change",
      event => {

        addGeneralFiles(
          event.target.files
        );

      }
    );


    /* ========================================================
       PRESET MENU
       ======================================================== */

    el.presetButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        el.presetMenu.classList.toggle(
          "open"
        );


        el.attachMenu.classList.remove(
          "open"
        );


        el.attachButton.classList.remove(
          "open"
        );

      }
    );


    document.addEventListener(
      "click",
      event => {

        if (
          !el.presetMenu.contains(
            event.target
          )
          &&
          event.target !==
          el.presetButton
        ) {

          el.presetMenu.classList.remove(
            "open"
          );

        }


        if (
          !el.attachMenu.contains(
            event.target
          )
          &&
          event.target !==
          el.attachButton
        ) {

          el.attachMenu.classList.remove(
            "open"
          );


          el.attachButton.classList.remove(
            "open"
          );

        }

      }
    );


    document
      .querySelectorAll(
        ".preset-option"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () =>
              setPreset(
                button.dataset.preset
              )
          );

        }
      );


    activePreset =
      "default";


    state.preset =
      "default";


    state.params =
      {
        ...PRESET_PARAMS.default
      };


    updatePresetUI();


    /* ========================================================
       CLEAR CHAT
       ======================================================== */

    function clearChat() {

      if (
        !confirm(
          "Clear this single chat?"
        )
      ) {

        return;

      }


      const rows =
        Array.from(
          el.messages.querySelectorAll(
            ".message-row"
          )
        );


      rows.forEach(
        row => {

          row.classList.add(
            "removing"
          );

        }
      );


      playClick();


      setTimeout(
        () => {

          state.conversation =
            [];


          saveState();


          pendingImages =
            [];


          pendingFiles =
            [];


          renderImagePreviews();

          renderFilePreviews();


          el.messages.innerHTML =
            "";


          showWelcome();


          el.input.focus();

        },
        300
      );

    }


    /* ========================================================
       EXPORT
       ======================================================== */

    function exportChat() {

      const blob =
        new Blob(

          [
            JSON.stringify(
              state,
              null,
              2
            )
          ],

          {
            type:
              "application/json"
          }

        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        "greg_chat_state.json";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      URL.revokeObjectURL(
        url
      );

    }


    /* ========================================================
       REPLAY
       ======================================================== */

    function replayConversation() {

      el.messages.innerHTML =
        "";


      if (
        state.conversation.length ===
        0
      ) {

        showWelcome();

        return;

      }


      for (
        const item
        of state.conversation
      ) {

        if (
          item.role ===
          "user"
        ) {

          addUserMessage(

            item.content || "",

            Array.isArray(
              item.images
            )
              ? item.images
              : [],

            Array.isArray(
              item.files
            )
              ? item.files
              : []

          );

        } else if (
          item.role ===
          "assistant"
        ) {

          addStaticGregMessage(

            item.content || ""

          );

        }

      }


      scrollBottom(
        false
      );

    }


    /* ========================================================
       INPUT
       ======================================================== */

    el.input.addEventListener(
      "input",
      resizeInput
    );


    el.input.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
          &&
          !event.shiftKey
        ) {

          event.preventDefault();


          sendMessage();

        }

      }
    );


    /* ========================================================
       BUTTONS
       ======================================================== */

    el.sendBtn.addEventListener(
      "click",
      sendMessage
    );


    el.testBtn.addEventListener(
      "click",
      testApi
    );


    el.clearBtn.addEventListener(
      "click",
      clearChat
    );


    el.exportBtn.addEventListener(
      "click",
      exportChat
    );


    /* ========================================================
       STARTUP
       ======================================================== */

    replayConversation();

    updateUI();

    resizeInput();

    renderImagePreviews();

    renderFilePreviews();


    setTimeout(
      testApi,
      500
    );


    setTimeout(
      () => {

        el.input.focus();

      },
      700
    );

  </script>

</body>

</html>
