<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Greg AI</title>

  <style>

    :root {

      --bg: #050b08;
      --bg2: #030605;

      --text: #ecf7ef;
      --muted: #92a99d;

      --accent: #8df0a0;
      --accent-2: #54c7ff;

      --good: #8df0a0;
      --warn: #ffd56a;
      --bad: #ff7f7f;

      --line: rgba(255,255,255,0.08);

      --code-bg: #0a0d0c;
      --code-header: #111614;
      --code-line: rgba(255,255,255,0.06);
      --code-text: #d7e8dd;

      --shadow:
        0 22px 60px rgba(0,0,0,0.42);

      --sans:
        Inter,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;

      --mono:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      color: var(--text);

      font-family: var(--sans);

      background:
        radial-gradient(
          circle at top,
          rgba(105,255,170,0.12),
          transparent 34%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(84,199,255,0.08),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          var(--bg),
          var(--bg2) 72%
        );

      overflow: hidden;
    }


    button,
    textarea {
      font: inherit;
    }


    /* ========================================================
       ANIMATED BACKGROUND
       ======================================================== */

    #bgCanvas {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;

      pointer-events: none;
    }


    .animated-bg {

      position: fixed;
      inset: 0;

      z-index: 0;

      overflow: hidden;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(141,240,160,0.10),
          transparent 22%
        ),
        radial-gradient(
          circle at 80% 15%,
          rgba(84,199,255,0.10),
          transparent 20%
        ),
        radial-gradient(
          circle at 50% 78%,
          rgba(255,213,106,0.08),
          transparent 24%
        ),
        linear-gradient(
          180deg,
          rgba(3,6,5,0.92),
          rgba(5,11,8,0.96)
        );
    }


    .animated-bg::before,
    .animated-bg::after {

      content: "";

      position: absolute;

      inset: -35%;

      background-repeat: no-repeat;

      filter:
        blur(32px)
        saturate(1.3);

      opacity: 0.85;

      animation:
        bgDrift 12s ease-in-out infinite alternate,
        bgHue 22s linear infinite;
    }


    .animated-bg::before {

      background-image:
        radial-gradient(
          circle at 14% 24%,
          rgba(255,93,184,0.30),
          transparent 18%
        ),
        radial-gradient(
          circle at 42% 18%,
          rgba(84,199,255,0.32),
          transparent 19%
        ),
        radial-gradient(
          circle at 78% 24%,
          rgba(141,240,160,0.30),
          transparent 20%
        ),
        radial-gradient(
          circle at 24% 78%,
          rgba(255,213,106,0.24),
          transparent 22%
        ),
        radial-gradient(
          circle at 72% 74%,
          rgba(160,102,255,0.28),
          transparent 20%
        );
    }


    .animated-bg::after {

      background-image:
        radial-gradient(
          circle at 18% 52%,
          rgba(84,199,255,0.20),
          transparent 16%
        ),
        radial-gradient(
          circle at 52% 34%,
          rgba(255,120,120,0.16),
          transparent 15%
        ),
        radial-gradient(
          circle at 82% 58%,
          rgba(141,240,160,0.20),
          transparent 16%
        ),
        radial-gradient(
          circle at 50% 92%,
          rgba(255,255,255,0.05),
          transparent 24%
        );

      animation-duration:
        16s,
        28s;

      animation-direction:
        alternate-reverse,
        normal;

      opacity: 0.7;
    }


    .animated-grid {

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        );

      background-size: 64px 64px;

      mask-image:
        radial-gradient(
          circle at center,
          black 22%,
          transparent 78%
        );

      opacity: 0.25;

      animation:
        gridFloat 20s linear infinite;
    }


    .animated-scanline {

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 0%,
          rgba(255,255,255,0.03) 50%,
          transparent 100%
        );

      background-size:
        100% 220px;

      opacity: 0.13;

      mix-blend-mode: screen;

      animation:
        scanMove 7s linear infinite;
    }


    @keyframes bgDrift {

      0% {

        transform:
          translate3d(-2%, -1%, 0)
          scale(1.02)
          rotate(0deg);
      }

      50% {

        transform:
          translate3d(1.8%, 1.4%, 0)
          scale(1.08)
          rotate(6deg);
      }

      100% {

        transform:
          translate3d(-1%, 2%, 0)
          scale(1.04)
          rotate(-5deg);
      }
    }


    @keyframes bgHue {

      0% {

        filter:
          blur(32px)
          saturate(1.3)
          hue-rotate(0deg);
      }

      100% {

        filter:
          blur(32px)
          saturate(1.45)
          hue-rotate(360deg);
      }
    }


    @keyframes gridFloat {

      from {
        transform:
          translate3d(0,0,0);
      }

      to {
        transform:
          translate3d(64px,64px,0);
      }
    }


    @keyframes scanMove {

      from {
        transform:
          translateY(-220px);
      }

      to {
        transform:
          translateY(220px);
      }
    }


    /* ========================================================
       APP
       ======================================================== */

    .app {

      position: relative;

      z-index: 2;

      width: 100%;
      height: 100vh;

      display:
        flex;

      flex-direction:
        column;
    }


    /* ========================================================
       TOP BAR
       ======================================================== */

    .topbar {

      height: 66px;

      flex: none;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        0 20px;

      border-bottom:
        1px solid var(--line);

      background:
        rgba(5,11,8,0.72);

      backdrop-filter:
        blur(18px);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.12);

      animation:
        topbarIn .5s ease both;
    }


    @keyframes topbarIn {

      from {

        opacity: 0;

        transform:
          translateY(-16px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    .title-wrap {

      display:
        flex;

      align-items:
        center;

      gap: 11px;
    }


    .orb {

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background:
        var(--warn);

      box-shadow:
        0 0 18px
        rgba(255,213,106,0.7);

      transition:
        background .25s ease,
        box-shadow .25s ease,
        transform .3s ease;
    }


    .orb.online {

      background:
        var(--good);

      transform:
        scale(1.15);

      animation:
        orbPulse 2s ease-in-out infinite;
    }


    @keyframes orbPulse {

      0%,
      100% {

        box-shadow:
          0 0 12px
          rgba(141,240,160,0.55);
      }

      50% {

        box-shadow:
          0 0 24px
          rgba(141,240,160,0.95);
      }
    }


    .brand {

      display:
        flex;

      align-items:
        baseline;

      gap: 7px;
    }


    .title {

      font-weight: 900;

      letter-spacing:
        .06em;

      font-size:
        15px;
    }


    .version {

      color:
        var(--muted);

      font-size:
        11px;
    }


    .status-line {

      color:
        var(--muted);

      font-size:
        11px;

      margin-top:
        2px;
    }


    .top-actions {

      display:
        flex;

      gap:
        7px;
    }


    .icon-btn {

      width: 38px;
      height: 38px;

      border-radius:
        12px;

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.04);

      color:
        var(--text);

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .icon-btn:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.08);

      border-color:
        rgba(255,255,255,0.16);
    }


    /* ========================================================
       CHAT
       ======================================================== */

    .chat-shell {

      position:
        relative;

      flex:
        1;

      min-height:
        0;

      display:
        flex;

      justify-content:
        center;
    }


    .chat-column {

      width:
        min(920px,100%);

      height:
        100%;

      min-height:
        0;
    }


    .messages {

      width:
        100%;

      height:
        100%;

      overflow-y:
        auto;

      padding:
        30px 24px 220px;

      scroll-behavior:
        smooth;

      scrollbar-width:
        thin;

      scrollbar-color:
        rgba(255,255,255,.14)
        transparent;
    }


    .messages::-webkit-scrollbar {

      width:
        10px;
    }


    .messages::-webkit-scrollbar-thumb {

      background:
        rgba(255,255,255,0.12);

      border-radius:
        999px;

      border:
        2px solid transparent;

      background-clip:
        content-box;
    }


    /* ========================================================
       WELCOME
       ======================================================== */

    .welcome {

      min-height:
        calc(100vh - 270px);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      padding:
        40px 10px;

      animation:
        welcomeIn .7s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes welcomeIn {

      from {

        opacity: 0;

        transform:
          translateY(22px)
          scale(.98);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .welcome-orb {

      width: 72px;
      height: 72px;

      border-radius:
        24px;

      display:
        grid;

      place-items:
        center;

      color:
        #07210f;

      font-size:
        30px;

      font-weight:
        1000;

      background:
        linear-gradient(
          135deg,
          #adffc0,
          #65db89
        );

      box-shadow:
        0 20px 55px
        rgba(109,227,139,0.22);

      animation:
        welcomeOrb 2.8s ease-in-out infinite;
    }


    @keyframes welcomeOrb {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-5px);
      }
    }


    .welcome h1 {

      margin:
        22px 0 8px;

      font-size:
        clamp(30px,5vw,48px);

      letter-spacing:
        -.04em;
    }


    .welcome p {

      max-width:
        580px;

      margin:
        0;

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.65;
    }


    .welcome-suggestions {

      display:
        grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:
        10px;

      width:
        min(620px,100%);

      margin-top:
        24px;
    }


    .suggestion {

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.035);

      color:
        var(--text);

      border-radius:
        16px;

      padding:
        12px 14px;

      text-align:
        left;

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .suggestion:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.07);

      border-color:
        rgba(141,240,160,0.2);
    }


    .suggestion-title {

      font-size:
        12px;

      font-weight:
        800;
    }


    .suggestion-text {

      color:
        var(--muted);

      font-size:
        12px;

      line-height:
        1.4;

      margin-top:
        4px;
    }


    /* ========================================================
       MESSAGE ROWS
       ======================================================== */

    .message-row {

      display:
        flex;

      gap:
        14px;

      margin-bottom:
        28px;

      animation:
        messageIn .38s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes messageIn {

      from {

        opacity:
          0;

        transform:
          translateY(12px)
          scale(.99);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .message-row.user {

      justify-content:
        flex-end;
    }


    .message-row.greg {

      justify-content:
        flex-start;
    }


    .avatar {

      width: 32px;
      height: 32px;

      flex:
        none;

      border-radius:
        11px;

      display:
        grid;

      place-items:
        center;

      font-size:
        12px;

      font-weight:
        900;

      margin-top:
        2px;
    }


    .greg .avatar {

      background:
        linear-gradient(
          135deg,
          #a5ffb3,
          #68dc8c
        );

      color:
        #06210e;

      box-shadow:
        0 8px 20px
        rgba(109,227,139,.16);
    }


    .user .avatar {

      background:
        linear-gradient(
          135deg,
          #73d2ff,
          #4a92ff
        );

      color:
        #06121c;
    }


    .message-content {

      max-width:
        min(760px,calc(100% - 52px));

      min-width:
        0;
    }


    .message-name {

      font-size:
        11px;

      font-weight:
        800;

      color:
        var(--muted);

      margin-bottom:
        5px;
    }


    .message-text {

      white-space:
        pre-wrap;

      word-break:
        break-word;

      line-height:
        1.65;

      font-size:
        15px;
    }


    .user .message-content {

      padding:
        12px 15px;

      border-radius:
        18px;

      background:
        linear-gradient(
          180deg,
          rgba(84,199,255,.17),
          rgba(84,199,255,.08)
        );

      border:
        1px solid
        rgba(84,199,255,.20);
    }


    /* ========================================================
       THINKING
       ======================================================== */

    .typing-dots {

      display:
        inline-flex;

      gap:
        5px;

      padding-top:
        5px;
    }


    .typing-dots span {

      width:
        7px;

      height:
        7px;

      border-radius:
        50%;

      background:
        rgba(236,247,239,.7);

      animation:
        typingBounce 1s infinite ease-in-out;
    }


    .typing-dots span:nth-child(2) {
      animation-delay: .12s;
    }


    .typing-dots span:nth-child(3) {
      animation-delay: .24s;
    }


    @keyframes typingBounce {

      0%,
      80%,
      100% {

        transform:
          translateY(0);

        opacity:
          .45;
      }

      40% {

        transform:
          translateY(-5px);

        opacity:
          1;
      }
    }


    /* ========================================================
       THINKING PANEL
       ======================================================== */

    .thinking-panel {

      max-height:
        0;

      overflow:
        hidden;

      opacity:
        0;

      transform:
        translateY(7px);

      margin:
        0;

      transition:
        max-height .42s cubic-bezier(.16,1,.3,1),
        opacity .25s ease,
        transform .35s cubic-bezier(.2,.8,.2,1),
        margin .35s ease;
    }


    .thinking-panel.visible {

      max-height:
        6000px;

      opacity:
        1;

      transform:
        translateY(0);

      margin:
        0 0 10px;
    }


    .thinking-panel.closing {

      max-height:
        0;

      opacity:
        0;

      transform:
        translateY(-6px);

      margin:
        0;
    }


    .thinking-header {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      min-height:
        20px;

      color:
        #858d87;

      font-size:
        13px;

      font-weight:
        700;

      user-select:
        none;
    }


    .thinking-dot {

      width:
        6px;

      height:
        6px;

      flex:
        none;

      border-radius:
        50%;

      background:
        #7f8782;

      animation:
        thinkingDotPulse 1.15s ease-in-out infinite;
    }


    @keyframes thinkingDotPulse {

      0%,
      100% {

        opacity:
          .35;

        transform:
          scale(.8);
      }

      50% {

        opacity:
          1;

        transform:
          scale(1);
      }
    }


    .thinking-label {

      display:
        inline-flex;

      align-items:
        center;

      font-size:
        13px;
    }


    .thinking-label-char {

      display:
        inline-block;

      white-space:
        pre;

      animation:
        thinkingLabelWave 1.4s ease-in-out infinite;

      animation-delay:
        var(--thinking-delay);
    }


    @keyframes thinkingLabelWave {

      0%,
      100% {

        transform:
          translateY(0);

        opacity:
          .55;
      }

      50% {

        transform:
          translateY(-2px);

        opacity:
          1;
      }
    }


    .thinking-content {

      margin-top:
        8px;

      padding-left:
        13px;

      color:
        #717a74;

      font-size:
        12px;

      line-height:
        1.55;

      white-space:
        pre-wrap;

      overflow-wrap:
        anywhere;
    }


    /* ========================================================
       STREAM CURSOR
       ======================================================== */

    .stream-cursor {

      display:
        inline-block;

      width:
        7px;

      height:
        18px;

      margin-left:
        4px;

      vertical-align:
        -3px;

      border-radius:
        2px;

      background:
        rgba(236,247,239,.8);

      animation:
        cursorBlink .85s steps(1) infinite;
    }


    @keyframes cursorBlink {

      50% {
        opacity: 0;
      }
    }


    /* ========================================================
       ORDERED CODE BLOCK
       ======================================================== */

    .code-block-shell {

      display:
        grid;

      grid-template-rows:
        0fr;

      opacity:
        0;

      transform:
        translateY(10px)
        scale(.985);

      margin:
        0;

      transition:
        grid-template-rows .42s cubic-bezier(.16,1,.3,1),
        opacity .30s ease,
        transform .42s cubic-bezier(.16,1,.3,1),
        margin .42s ease;
    }


    .code-block-shell.open {

      grid-template-rows:
        1fr;

      opacity:
        1;

      transform:
        translateY(0)
        scale(1);

      margin:
        13px 0;
    }


    .code-block-inner {

      min-height:
        0;

      overflow:
        hidden;
    }


    .code-block {

      width:
        100%;

      border:
        1px solid
        rgba(255,255,255,0.09);

      border-radius:
        15px;

      overflow:
        hidden;

      background:
        var(--code-bg);

      box-shadow:
        0 12px 28px
        rgba(0,0,0,0.22);
    }


    .code-header {

      min-height:
        38px;

      padding:
        0 10px 0 13px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;

      border-bottom:
        1px solid
        var(--code-line);

      background:
        var(--code-header);

      animation:
        codeHeaderIn .30s .05s ease both;
    }


    @keyframes codeHeaderIn {

      from {

        opacity:
          0;

        transform:
          translateY(-5px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    .code-language {

      color:
        #aab9b1;

      font-family:
        var(--mono);

      font-size:
        11px;

      font-weight:
        700;
    }


    .code-copy {

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.04);

      color:
        #c8d2cc;

      border-radius:
        8px;

      padding:
        5px 8px;

      cursor:
        pointer;

      font-size:
        11px;

      transition:
        background .12s ease,
        transform .12s ease;
    }


    .code-copy:hover {

      background:
        rgba(255,255,255,0.09);

      transform:
        translateY(-1px);
    }


    .code-content {

      overflow-x:
        auto;

      padding:
        14px;

      color:
        var(--code-text);

      font-family:
        var(--mono);

      font-size:
        13px;

      line-height:
        1.6;

      white-space:
        pre;

      tab-size:
        4;

      min-height:
        18px;
    }


    .code-content::-webkit-scrollbar {

      height:
        8px;
    }


    .code-content::-webkit-scrollbar-thumb {

      background:
        rgba(255,255,255,0.12);

      border-radius:
        999px;
    }


    .code-block.live {

      border-color:
        rgba(141,240,160,0.17);

      box-shadow:
        0 12px 28px rgba(0,0,0,0.22),
        0 0 0 1px
        rgba(141,240,160,0.035);
    }


    /* ========================================================
       COMPOSER
       ======================================================== */

    .composer-area {

      position:
        fixed;

      left:
        0;

  <script>

    /* ========================================================
       AUDIO
       ======================================================== */

    const bgMusic =
      document.getElementById(
        "bgMusic"
      );


    bgMusic.volume =
      0.3;


    bgMusic
      .play()
      .catch(() => {});


    document.addEventListener(
      "click",
      () => {

        if (
          bgMusic.paused
        ) {

          bgMusic
            .play()
            .catch(() => {});

        }

      },
      {
        once:
          true
      }
    );


    /* ========================================================
       BACKGROUND CANVAS
       ======================================================== */

    const canvas =
      document.getElementById(
        "bgCanvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    function resizeCanvas() {

      const dpr =
        Math.max(
          1,
          window.devicePixelRatio || 1
        );


      canvas.width =
        Math.floor(
          window.innerWidth *
          dpr
        );


      canvas.height =
        Math.floor(
          window.innerHeight *
          dpr
        );


      canvas.style.width =
        window.innerWidth +
        "px";


      canvas.style.height =
        window.innerHeight +
        "px";


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();


    const particles =
      Array.from(
        {
          length:
            42
        },
        () => ({

          x:
            Math.random() *
            window.innerWidth,

          y:
            Math.random() *
            window.innerHeight,

          r:
            18 +
            Math.random() *
            55,

          vx:
            (
              Math.random() -
              0.5
            ) *
            0.22,

          vy:
            (
              Math.random() -
              0.5
            ) *
            0.18,

          hue:
            Math.floor(
              Math.random() *
              360
            ),

          alpha:
            0.05 +
            Math.random() *
            0.18,

          pulse:
            Math.random() *
            Math.PI *
            2

        })
      );


    function drawCanvasBg() {

      const w =
        window.innerWidth;


      const h =
        window.innerHeight;


      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      const g =
        ctx.createLinearGradient(
          0,
          0,
          w,
          h
        );


      g.addColorStop(
        0,
        "rgba(10,18,14,0.10)"
      );


      g.addColorStop(
        1,
        "rgba(3,6,5,0.14)"
      );


      ctx.fillStyle =
        g;


      ctx.fillRect(
        0,
        0,
        w,
        h
      );


      ctx.save();


      ctx.globalCompositeOperation =
        "lighter";


      for (
        const p
        of particles
      ) {

        p.x +=
          p.vx;


        p.y +=
          p.vy;


        p.pulse +=
          0.018;


        if (
          p.x < -120
        ) {

          p.x =
            w + 120;

        }


        if (
          p.x > w + 120
        ) {

          p.x =
            -120;

        }


        if (
          p.y < -120
        ) {

          p.y =
            h + 120;

        }


        if (
          p.y > h + 120
        ) {

          p.y =
            -120;

        }


        const r =
          p.r +
          Math.sin(
            p.pulse
          ) *
          10;


        const grad =
          ctx.createRadialGradient(
            p.x,
            p.y,
            0,
            p.x,
            p.y,
            r
          );


        grad.addColorStop(
          0,
          `hsla(
            ${p.hue},
            95%,
            72%,
            ${p.alpha}
          )`
        );


        grad.addColorStop(
          0.45,
          `hsla(
            ${(p.hue + 40) % 360},
            95%,
            62%,
            ${p.alpha * 0.45}
          )`
        );


        grad.addColorStop(
          1,
          "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
          grad;


        ctx.beginPath();


        ctx.arc(
          p.x,
          p.y,
          r,
          0,
          Math.PI * 2
        );


        ctx.fill();

      }


      ctx.restore();


      requestAnimationFrame(
        drawCanvasBg
      );

    }


    requestAnimationFrame(
      drawCanvasBg
    );


    /* ========================================================
       API
       ======================================================== */

    const API_URL = "https://improved-basename-star-latin.trycloudflare.com";


    /* ========================================================
       STORAGE
       ======================================================== */

    const STORAGE_KEY =
      "greg_ui_api_v6";


    /* ========================================================
       PRESETS
       ======================================================== */

    const DEFAULT_PARAMS = {

      max_new_tokens:
        2000,

      temperature:
        0.6,

      top_p:
        0.85,

      top_k:
        40,

      repetition_penalty:
        1.2,

      no_repeat_ngram_size:
        4

    };


    const PRESET_PARAMS = {

      default: {

        max_new_tokens:
          2000,

        temperature:
          0.6,

        top_p:
          0.85,

        top_k:
          40,

        repetition_penalty:
          1.2,

        no_repeat_ngram_size:
          4

      },


      fast: {

        max_new_tokens:
          2500,

        temperature:
          0.5,

        top_p:
          0.8,

        top_k:
          30,

        repetition_penalty:
          1.15,

        no_repeat_ngram_size:
          3

      },


      smart: {

        max_new_tokens:
          3000,

        temperature:
          0.7,

        top_p:
          0.9,

        top_k:
          50,

        repetition_penalty:
          1.25,

        no_repeat_ngram_size:
          4

      }

    };


    /* ========================================================
       ELEMENTS
       ======================================================== */

    const el = {

      messages:
        document.getElementById(
          "messages"
        ),

      input:
        document.getElementById(
          "input"
        ),

      sendBtn:
        document.getElementById(
          "sendBtn"
        ),

      testBtn:
        document.getElementById(
          "testBtn"
        ),

      clearBtn:
        document.getElementById(
          "clearBtn"
        ),

      exportBtn:
        document.getElementById(
          "exportBtn"
        ),

      statusLine:
        document.getElementById(
          "statusLine"
        ),

      memoryHint:
        document.getElementById(
          "memoryHint"
        ),

      orb:
        document.getElementById(
          "orb"
        ),

      presetButton:
        document.getElementById(
          "presetButton"
        ),

      presetButtonText:
        document.getElementById(
          "presetButtonText"
        ),

      presetMenu:
        document.getElementById(
          "presetMenu"
        )

    };


    /* ========================================================
       STATE
       ======================================================== */

    let state =
      loadState();


    let isSending =
      false;


    let connected =
      false;


    let activePreset =
      state.preset ||
      "default";


    /* ========================================================
       STATE
       ======================================================== */

    function loadState() {

      try {

        const raw =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (!raw) {

          return {

            params:
              {
                ...PRESET_PARAMS.default
              },

            conversation:
              [],

            preset:
              "default"

          };

        }


        const parsed =
          JSON.parse(
            raw
          );


        return {

          params:
            {
              ...PRESET_PARAMS.default
            },

          conversation:
            Array.isArray(
              parsed.conversation
            )
              ? parsed.conversation
              : [],

          preset:
            "default"

        };

      } catch {

        return {

          params:
            {
              ...PRESET_PARAMS.default
            },

          conversation:
            [],

          preset:
            "default"

        };

      }

    }


    function saveState() {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          state
        )

      );

    }


    /* ========================================================
       HELPERS
       ======================================================== */

    function sleep(
      ms
    ) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );

    }


    function resizeInput() {

      el.input.style.height =
        "auto";


      el.input.style.height =
        Math.min(
          el.input.scrollHeight,
          190
        ) +
        "px";

    }


    function scrollBottom(
      smooth = true
    ) {

      el.messages.scrollTo({

        top:
          el.messages.scrollHeight,

        behavior:
          smooth
            ? "smooth"
            : "auto"

      });

    }


    /* ========================================================
       THINKING ANIMATION HELPERS
       ======================================================== */

    function buildWavyText(
      element,
      text,
      startIndex = 0
    ) {

      const chars =
        Array.from(
          String(text)
        );


      let index =
        startIndex;


      for (
        const char
        of chars
      ) {

        if (
          char ===
          "\n"
        ) {

          element.appendChild(
            document.createElement(
              "br"
            )
          );


          index += 1;


          continue;

        }


        const span =
          document.createElement(
            "span"
          );


        span.className =
          "thinking-label-char";


        span.textContent =
          char;


        const waveDelay =
          (
            index *
            0.06
          );


        span.style.setProperty(
          "--thinking-delay",
          `${waveDelay}s`
        );


        element.appendChild(
          span
        );


        index += 1;

      }


      return index;

    }


    function appendThinkingText(
      stream,
      text
    ) {

      if (
        !text
      ) {

        return;

      }


      stream.thinkingContent.textContent +=
        text;


      stream.thinkingPanel.classList.add(
        "visible"
      );


      scrollBottom(
        false
      );

    }


    function startThinkingUI(
      stream
    ) {

      if (
        stream.thinkingStarted
      ) {

        return;

      }


      stream.thinkingStarted =
        true;


      stream.thinkingEnded =
        false;


      stream.thinkingContent.textContent =
        "";


      stream.thinkingLabel.innerHTML =
        "";


      buildWavyText(
        stream.thinkingLabel,
        "Thinking",
        0
      );


      stream.thinkingPanel.classList.remove(
        "closing"
      );


      requestAnimationFrame(
        () => {

          stream.thinkingPanel.classList.add(
            "visible"
          );

        }
      );


      scrollBottom(
        false
      );

    }


    function finishThinkingUI(
      stream
    ) {

      if (
        !stream.thinkingStarted ||
        stream.thinkingEnded
      ) {

        return;

      }


      stream.thinkingEnded =
        true;


      stream.thinkingPanel.classList.add(
        "closing"
      );


      setTimeout(
        () => {

          if (
            stream.thinkingPanel
          ) {

            stream.thinkingPanel.classList.remove(
              "visible"
            );

          }

        },
        420
      );

    }


    /*
     * The model can split:
     *
     * <thi
     * nk>
     *
     * or:
     *
     * </thin
     * k>
     *
     * across network chunks.
     *
     * This processor keeps enough text buffered so those
     * markers are detected correctly.
     */

    function processThinkingStream(
      chunk,
      parser,
      stream
    ) {

      if (
        !chunk
      ) {

        return;

      }


      stream.thinkingBuffer +=
        chunk;


      while (
        stream.thinkingBuffer.length
      ) {

        if (
          !stream.thinkingMode
        ) {

          const startIndex =
            stream.thinkingBuffer.indexOf(
              "<think>"
            );


          if (
            startIndex ===
            -1
          ) {

            const keepLength =
              "<think>".length - 1;


            if (
              stream.thinkingBuffer.length <=
              keepLength
            ) {

              return;

            }


            const safeLength =
              stream.thinkingBuffer.length -
              keepLength;


            const safeText =
              stream.thinkingBuffer.slice(
                0,
                safeLength
              );


            stream.thinkingBuffer =
              stream.thinkingBuffer.slice(
                safeLength
              );


            if (
              safeText
            ) {

              stream.answerText +=
                safeText;


              parser.feed(
                safeText
              );

            }


            continue;

          }


          const answerBeforeThink =
            stream.thinkingBuffer.slice(
              0,
              startIndex
            );


          if (
            answerBeforeThink
          ) {

            stream.answerText +=
              answerBeforeThink;


            parser.feed(
              answerBeforeThink
            );

          }


          stream.thinkingBuffer =
            stream.thinkingBuffer.slice(
              startIndex +
              "<think>".length
            );


          stream.thinkingMode =
            true;


          startThinkingUI(
            stream
          );


          continue;

        }


        const endIndex =
          stream.thinkingBuffer.indexOf(
            "</think>"
          );


        if (
          endIndex ===
          -1
        ) {

          const keepLength =
            "</think>".length - 1;


          if (
            stream.thinkingBuffer.length <=
            keepLength
          ) {

            return;

          }


          const safeLength =
            stream.thinkingBuffer.length -
            keepLength;


          const thinkingText =
            stream.thinkingBuffer.slice(
              0,
              safeLength
            );


          stream.thinkingBuffer =
            stream.thinkingBuffer.slice(
              safeLength
            );


          appendThinkingText(
            stream,
            thinkingText
          );


          continue;

        }


        const thinkingText =
          stream.thinkingBuffer.slice(
            0,
            endIndex
          );


        if (
          thinkingText
        ) {

          appendThinkingText(
            stream,
            thinkingText
          );

        }


        stream.thinkingBuffer =
          stream.thinkingBuffer.slice(
            endIndex +
            "</think>".length
          );


        stream.thinkingMode =
          false;


        finishThinkingUI(
          stream
        );


        continue;

      }

    }


    function finishThinkingStream(
      parser,
      stream
    ) {

      if (
        !stream.thinkingBuffer
      ) {

        return;

      }


      if (
        stream.thinkingMode
      ) {

        /*
         * If the stream ends while the model is still inside
         * <think>, treat the remaining characters as thinking.
         */

        appendThinkingText(
          stream,
          stream.thinkingBuffer
        );


        stream.thinkingBuffer =
          "";


        finishThinkingUI(
          stream
        );


        return;

      }


      /*
       * No active thinking section.
       * Whatever remains is normal answer text.
       */

      stream.answerText +=
        stream.thinkingBuffer;


      parser.feed(
        stream.thinkingBuffer
      );


      stream.thinkingBuffer =
        "";

    }

    /* ========================================================
       OLD TYPEWRITER
       ======================================================== */

    async function typeText(
      element,
      text,
      delay = 5
    ) {

      const chars =
        Array.from(
          String(text)
        );


      for (
        let i = 0;
        i < chars.length;
        i++
      ) {

        const ch =
          chars[i];


        element.textContent +=
          ch;


        let wait =
          delay;


        if (
          ch === " "
        ) {

          wait +=
            10;

        } else if (
          ch === ","
        ) {

          wait +=
            40;

        } else if (
          ch === "."
        ) {

          wait +=
            80;

        } else if (
          ch === "!"
        ) {

          wait +=
            90;

        } else if (
          ch === "?"
        ) {

          wait +=
            90;

        } else if (
          ch === "\n"
        ) {

          wait +=
            120;

        }


        await sleep(
          wait
        );

      }

    }

      copyButton.type =

        "Copy";

        );


      codeContent.className =

      copyButton.addEventListener(
        "click",
        async () => {

          try {

            await navigator.clipboard.writeText(
              codeContent.textContent
            );


            copyButton.textContent =
              "Copied!";


            setTimeout(
              () =>
                copyButton.textContent =
                  "Copy",
              1200
            );


          } catch {

            copyButton.textContent =
              "Copy failed";


            setTimeout(
              () =>
                copyButton.textContent =
                  "Copy",
              1200
            );

          }

        }
      );


      header.appendChild(
        languageLabel
      );


      header.appendChild(
        copyButton
      );


      block.appendChild(
        header
      );


      block.appendChild(
        codeContent
      );


      inner.appendChild(
        block
      );


      shell.appendChild(
        inner
      );


      /*
       * Insert first, then next frame open it.
       * This makes the surrounding content move smoothly.
       */

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            () => {

              shell.classList.add(
                "open"
              );

            }
          );

        }
      );


      return {

        shell,
        block,
        codeContent,
        languageLabel

      };

    }


    /* ========================================================
       ORDERED RENDER QUEUE
       ========================================================
       
       THIS IS THE IMPORTANT FIX.

       Every piece of output becomes an operation.

       Example:

       TEXT
       CODE_OPEN
       CODE_TEXT
       CODE_TEXT
       CODE_CLOSE
       TEXT

       One renderer processes those operations in exactly
       that order.

       Nothing can jump ahead of the text before it.
       ======================================================== */

    class OrderedRenderer {

      constructor(
        stream
      ) {

        this.stream =
          stream;

        this.queue =
          [];

        this.running =
          false;

        this.finished =
          false;

        this.waiter =
          null;

        this.code =
          null;

        this.textElement =
          null;

      }


      enqueue(
        operation
      ) {

        this.queue.push(
          operation
        );


        this.wake();

        this.run();

      }


      wake() {

        if (
          this.waiter
        ) {

          const resolve =
            this.waiter;

          this.waiter =
            null;

          resolve();

        }

      }


      async waitForQueue() {

        if (
          this.queue.length
        ) {

          return;

        }


        if (
          this.finished
        ) {

          return;

        }


        await new Promise(
          resolve => {

            this.waiter =
              resolve;

          }
        );

      }


      async run() {

        if (
          this.running
        ) {

          return;

        }


        this.running =
          true;


        try {

          while (
            !this.finished ||
            this.queue.length
          ) {

            if (
              !this.queue.length
            ) {

              await this.waitForQueue();

              continue;

            }


            const operation =
              this.queue.shift();


            await this.renderOperation(
              operation
            );

          }

        } finally {

          this.running =
            false;

        }

      }


      async renderOperation(
        operation
      ) {

        if (
          operation.type ===
          "text"
        ) {

          await this.renderText(
            operation.text
          );

          return;

        }


        if (
          operation.type ===
          "code-open"
        ) {

          await this.renderCodeOpen(
            operation.language
          );

          return;

        }


        if (
          operation.type ===
          "code-text"
        ) {

          this.renderCodeText(
            operation.text
          );

          return;

        }


        if (
          operation.type ===
          "code-close"
        ) {

          this.renderCodeClose();

        }

      }


      async renderText(
        text
      ) {

        if (
          !text
        ) {

          return;

        }


        const span =
          document.createElement(
            "span"
          );


        span.className =
          "message-text";


        this.stream.output.appendChild(
          span
        );


        this.textElement =
          span;


        await typeText(
          span,
          text,
          25
        );


        scrollBottom(
          false
        );

      }


      async renderCodeOpen(
        language
      ) {

        /*
         * Wait until whatever text came before it has fully
         * finished typing. Because this function is called by
         * the same queue, this is guaranteed.
         */

        const code =
          createCodeBlock(
            language
          );


        this.stream.output.appendChild(
          code.shell
        );


        this.code =
          code;


        scrollBottom(
          false
        );


        /*
         * Let the height-opening animation visibly begin before
         * the next queued operation writes into it.
         */

        await sleep(
          30
        );

      }


      renderCodeText(
        text
      ) {

        if (
          !this.code ||
          !text
        ) {

          return;

        }


        /*
         * NO typeText here.
         *
         * Code must preserve:
         *
         * spaces
         * tabs
         * indentation
         * newlines
         */

        this.code.codeContent.textContent +=
          text;


        scrollBottom(
          false
        );

      }


      renderCodeClose() {

        if (
          !this.code
        ) {

          return;

        }


        this.code.block.classList.remove(
          "live"
        );


        this.code =
          null;


        scrollBottom(
          false
        );

      }


      async finish() {

        this.finished =
          true;


        this.wake();


        while (
          this.running ||
          this.queue.length
        ) {

          await sleep(
            10
          );

        }

      }

    }


    /* ========================================================
       STREAM PARSER
       ========================================================
       
       The parser ONLY creates ordered operations.

       It never directly changes the screen.

       That is what prevents the old ordering bug.
       ======================================================== */

    class StreamParser {

      constructor(
        renderer
      ) {

        this.renderer =
          renderer;

        this.mode =
          "text";

        this.pending =
          "";

        this.finished =
          false;

      }


      feed(
        incoming
      ) {

        if (
          !incoming ||
          this.finished
        ) {

          return;

        }


        this.pending +=
          incoming;


        this.process();

      }


      process() {

        while (
          this.pending.length
        ) {

          /* ==================================================
             NORMAL TEXT
             ================================================== */

          if (
            this.mode ===
            "text"
          ) {

            const markerIndex =
              this.pending.indexOf(
                "```"
              );


            if (
              markerIndex ===
              -1
            ) {

              /*
               * Keep two chars in case a network packet splits:
               *
               * ```
               */

              if (
                this.pending.length <=
                2
              ) {

                return;

              }


              const safeText =
                this.pending.slice(
                  0,
                  this.pending.length - 2
                );


              this.pending =
                this.pending.slice(
                  -2
                );


              this.renderer.enqueue({

                type:
                  "text",

                text:
                  safeText

              });


              continue;

            }


            const textBefore =
              this.pending.slice(
                0,
                markerIndex
              );


            if (
              textBefore
            ) {

              this.renderer.enqueue({

                type:
                  "text",

                text:
                  textBefore

              });

            }


            this.pending =
              this.pending.slice(
                markerIndex + 3
              );


            this.mode =
              "language";


            continue;

          }


          /* ==================================================
             LANGUAGE
             ================================================== */

          if (
            this.mode ===
            "language"
          ) {

            const newlineIndex =
              this.pending.indexOf(
                "\n"
              );


            if (
              newlineIndex ===
              -1
            ) {

              /*
               * Wait for the newline so the language label is
               * complete.
               */

              return;

            }


            const language =
              this.pending
                .slice(
                  0,
                  newlineIndex
                )
                .trim();


            this.pending =
              this.pending.slice(
                newlineIndex + 1
              );


            this.renderer.enqueue({

              type:
                "code-open",

              language:
                language ||
                "code"

            });


            this.mode =
              "code";


            continue;

          }


          /* ==================================================
             CODE
             ================================================== */

          if (
            this.mode ===
            "code"
          ) {

            const markerIndex =
              this.pending.indexOf(
                "```"
              );


            if (
              markerIndex ===
              -1
            ) {

              /*
               * Preserve a possible split closing fence.
               */

              if (
                this.pending.length <=
                2
              ) {

                return;

              }


              const safeCode =
                this.pending.slice(
                  0,
                  this.pending.length - 2
                );


              this.pending =
                this.pending.slice(
                  -2
                );


              this.renderer.enqueue({

                type:
                  "code-text",

                text:
                  safeCode

              });


              continue;

            }


            const codeBefore =
              this.pending.slice(
                0,
                markerIndex
              );


            if (
              codeBefore
            ) {

              this.renderer.enqueue({

                type:
                  "code-text",

                text:
                  codeBefore

              });

            }


            this.pending =
              this.pending.slice(
                markerIndex + 3
              );


            this.renderer.enqueue({

              type:
                "code-close"

            });


            this.mode =
              "text";


            continue;

          }

        }

      }


      finish() {

        if (
          this.finished
        ) {

          return;

        }


        if (
          this.pending
        ) {

          if (
            this.mode ===
            "text"
          ) {

            /*
             * If the final two characters were backticks but the
             * stream ended before a complete fence, they are
             * actual text.
             */

            this.renderer.enqueue({

              type:
                "text",

              text:
                this.pending

            });

          } else if (
            this.mode ===
            "code"
          ) {

            this.renderer.enqueue({

              type:
                "code-text",

              text:
                this.pending

            });

          } else if (
            this.mode ===
            "language"
          ) {

            /*
             * Incomplete language marker:
             * treat it as literal text rather than throwing it away.
             */

            this.renderer.enqueue({

              type:
                "text",

              text:
                "```" +
                this.pending

            });

          }

        }


        this.pending =
          "";

        this.finished =
          true;

      }

    }


    /* ========================================================
       STREAM MESSAGE
       ======================================================== */

    async function streamMessage(
      userText
    ) {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () =>
            controller.abort(),
          180000
        );


      const stream =
        createGregStream();


      const renderer =
        new OrderedRenderer(
          stream
        );


      const parser =
        new StreamParser(
          renderer
        );


      /*
       * Browser-side conversation memory.
       *
       * Only the latest 20 stored messages are sent.
       *
       * The current user message is NOT included here because
       * it is already sent separately as "message".
       */


      const recentMessages =
        state.conversation
          .slice(-20)
          .map(
            item =>
              `${
                item.role === "user"
                  ? "User"
                  : "Greg"
              }: ${item.content}`
          )
          .join(
            "\n\n"
          );


      try {

        const response =
          await fetch(

            `${API_URL}/chat/stream`,

            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "application/json"
                },

              body:
                JSON.stringify({

                  message:
                    userText,

                  memory:
                    recentMessages,

                  params:
                    state.params

                }),

              signal:
                controller.signal

            }

          );


        if (
          !response.ok
        ) {

          const errorText =
            await response.text();


          throw new Error(
            `HTTP ${response.status}: ${
              errorText ||
              "Request failed"
            }`
          );

        }


        if (
          !response.body
        ) {

          throw new Error(
            "Browser streaming is unavailable."
          );

        }


        const reader =
          response.body.getReader();


        const decoder =
          new TextDecoder(
            "utf-8"
          );


        while (
          true
        ) {

          const result =
            await reader.read();


          if (
            result.done
          ) {

            break;

          }


          const chunk =
            decoder.decode(
              result.value,
              {
                stream:
                  true
              }
            );


          if (
            !chunk
          ) {

            continue;

          }


          /*
           * Split <think>...</think> away from the normal answer.
           *
           * Thinking text goes to the animated thinking panel.
           *
           * Answer text goes to the normal ordered renderer.
           */

          processThinkingStream(

            chunk,

            parser,

            stream

          );


          scrollBottom(
            false
          );

        }


        const finalChunk =
          decoder.decode();


        if (
          finalChunk
        ) {

          processThinkingStream(

            finalChunk,

            parser,

            stream

          );

        }


        /*
         * Flush any characters still waiting in the thinking
         * splitter.
         */

        finishThinkingStream(

          parser,

          stream

        );


        /*
         * Wait until EVERY queued visual operation has finished.
         */

        parser.finish();


        await renderer.finish();


        finishThinkingUI(
          stream
        );


        if (
          stream.cursor &&
          stream.cursor.parentNode
        ) {

          stream.cursor.remove();

        }


        return stream.answerText.trim();


      } finally {

        clearTimeout(
          timeout
        );


        /*
         * If the request fails while Greg is thinking,
         * collapse the thinking UI instead of leaving it open.
         */

        finishThinkingUI(
          stream
        );


        parser.finish();


        await renderer.finish()
          .catch(
            () => {}
          );


        if (
          stream.cursor &&
          stream.cursor.parentNode
        ) {

          stream.cursor.remove();

        }

      }

    }


    /* ========================================================
       STATIC CODE BLOCK
       ======================================================== */

    function createStaticCodeBlock(
      language,
      code
    ) {

      const codeBlock =
        createCodeBlock(
          language
        );


      codeBlock.shell.classList.add(
        "open"
      );


      codeBlock.block.classList.remove(
        "live"
      );


      codeBlock.codeContent.textContent =
        code;


      return codeBlock.shell;

    }


    /* ========================================================
       STATIC MESSAGE RENDERER
       ======================================================== */

    function renderStaticMessage(
      container,
      text
    ) {

      let cursor =
        0;


      while (
        cursor <
        text.length
      ) {

        const start =
          text.indexOf(
            "```",
            cursor
          );


        if (
          start ===
          -1
        ) {

          const normal =
            text.slice(
              cursor
            );


          if (
            normal
          ) {

            const span =
              document.createElement(
                "span"
              );


            span.className =
              "message-text";


            span.textContent =
              normal;


            container.appendChild(
              span
            );

          }


          break;

        }


        if (
          start >
          cursor
        ) {

          const normal =
            text.slice(
              cursor,
              start
            );


          const span =
            document.createElement(
              "span"
            );


          span.className =
            "message-text";


          span.textContent =
            normal;


          container.appendChild(
            span
          );

        }


        const languageStart =
          start + 3;


        const languageEnd =
          text.indexOf(
            "\n",
            languageStart
          );


        if (
          languageEnd ===
          -1
        ) {

          const literal =
            document.createElement(
              "span"
            );


          literal.className =
            "message-text";


          literal.textContent =
            text.slice(
              start
            );


          container.appendChild(
            literal
          );


          break;

        }


        const language =
          text.slice(
            languageStart,
            languageEnd
          ).trim();


        const codeEnd =
          text.indexOf(
            "```",
            languageEnd + 1
          );


        if (
          codeEnd ===
          -1
        ) {

          container.appendChild(

            createStaticCodeBlock(

              language ||
              "code",

              text.slice(
                languageEnd + 1
              )

            )

          );


          break;

        }


        const code =
          text.slice(
            languageEnd + 1,
            codeEnd
          );


        container.appendChild(

          createStaticCodeBlock(

            language ||
            "code",

            code

          )

        );


        cursor =
          codeEnd + 3;

      }

    }


    /* ========================================================
       STATIC GREG MESSAGE
       ======================================================== */

    function addStaticGregMessage(
      text
    ) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row greg";


      row.innerHTML = `

        <div class="avatar">
          G
        </div>

        <div class="message-content">

          <div class="message-name">
            Greg
          </div>

          <div class="static-output"></div>

        </div>

      `;


      renderStaticMessage(

        row.querySelector(
          ".static-output"
        ),

        text

      );


      el.messages.appendChild(
        row
      );


      scrollBottom(
        false
      );


      return row;

    }


    /* ========================================================
       UPDATE UI
       ======================================================== */

    function updateUI() {

      el.statusLine.textContent =
        connected
          ? "Greg API connected"
          : "API offline";


      el.orb.classList.toggle(
        "online",
        connected
      );


      el.sendBtn.disabled =
        isSending;


      /*
       * The input stays enabled.
       */

      el.input.disabled =
        false;


      if (
        isSending
      ) {

        el.memoryHint.textContent =
          "Greg is generating...";

      } else if (
        connected
      ) {

        el.memoryHint.textContent =
          `Preset: ${
            activePreset
              .charAt(0)
              .toUpperCase()
            +
            activePreset.slice(1)
          }`;

      } else {

        el.memoryHint.textContent =
          "Waiting for connection";

      }

    }


    /* ========================================================
       API TEST
       ======================================================== */

    async function testApi() {

      el.testBtn.disabled =
        true;


      const oldHint =
        el.memoryHint.textContent;


      el.memoryHint.textContent =
        "Testing connection...";


      try {

        const response =
          await fetch(

            `${API_URL}/chat`,

            {

              method:
                "POST",

              headers:
                {
                  "Content-Type":
                    "application/json"
                },

              body:
                JSON.stringify({

                  message:
                    "ping",

                  params:
                    {

                      max_new_tokens:
                        1,

                      temperature:
                        0.01,

                      top_p:
                        0.01,

                      top_k:
                        1,

                      repetition_penalty:
                        1,

                      no_repeat_ngram_size:
                        0

                    }

                })

            }

          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        connected =
          true;


      } catch (
        error
      ) {

        console.error(
          error
        );


        connected =
          false;

      } finally {

        el.testBtn.disabled =
          false;


        if (
          !isSending
        ) {

          el.memoryHint.textContent =
            connected
              ? `Preset: ${
                  activePreset
                    .charAt(0)
                    .toUpperCase()
                  +
                  activePreset.slice(1)
                }`
              : oldHint;

        }


        updateUI();

      }

    }


    /* ========================================================
       SEND MESSAGE
       ======================================================== */

    async function sendMessage() {

      const text =
        el.input.value.trim();


      if (
        !text ||
        isSending
      ) {

        return;

      }


      removeWelcome();


      el.input.value =
        "";


      resizeInput();


      addUserMessage(
        text
      );


      isSending =
        true;


      updateUI();


      saveState();


      const thinking =
        addThinkingMessage();


      try {

        await sleep(
          180
        );


        if (
          thinking &&
          thinking.parentNode
        ) {

          thinking.remove();

        }


        /*
         * Stream from the server.
         *
         * The browser sends the latest 20 stored messages as
         * the "memory" string.
         *
         * The stream processor separates:
         *
         *     <think>...</think>
         *
         * from the normal answer.
         */

        const reply =
          await streamMessage(
            text
          );


        state.conversation.push({

          role:
            "user",

          content:
            text

        });


        state.conversation.push({

          role:
            "assistant",

          content:
            reply

        });


        state.conversation =
          state.conversation.slice(
            -24
          );


        saveState();


        connected =
          true;


      } catch (
        error
      ) {

        console.error(
          error
        );


        if (
          thinking &&
          thinking.parentNode
        ) {

          thinking.remove();

        }


        connected =
          false;


        const errorMessage =
          error &&
          error.name ===
          "AbortError"

            ? "Request timed out."

            : "Uh Oh! Server is having problems";


        addStaticGregMessage(
          errorMessage
        );

      } finally {

        isSending =
          false;


        updateUI();


        el.input.focus();

      }

    }


    /* ========================================================
       PRESETS
       ======================================================== */

    function updatePresetUI() {

      const labels = {

        default:
          "Default",

        fast:
          "Fast",

        smart:
          "Smart"

      };


      el.presetButtonText.textContent =
        labels[
          activePreset
        ] ||
        "Default";


      document
        .querySelectorAll(
          ".preset-option"
        )
        .forEach(
          button => {

            const active =
              button.dataset.preset ===
              activePreset;


            button.classList.toggle(
              "active",
              active
            );


            const check =
              button.querySelector(
                ".preset-check"
              );


            if (
              check
            ) {

              check.textContent =
                active
                  ? "✓"
                  : "";

            }

          }
        );

    }


    function setPreset(
      preset
    ) {

      if (
        !PRESET_PARAMS[preset]
      ) {

        preset =
          "default";

      }


      activePreset =
        preset;


      state.preset =
        preset;


      state.params =
        {
          ...PRESET_PARAMS[preset]
        };


      saveState();


      updatePresetUI();


      el.presetMenu.classList.remove(
        "open"
      );


      el.memoryHint.textContent =
        `Preset: ${
          preset
            .charAt(0)
            .toUpperCase()
          +
          preset.slice(1)
        }`;

    }


    el.presetButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        el.presetMenu.classList.toggle(
          "open"
        );

      }
    );


    document.addEventListener(
      "click",
      event => {

        if (
          !el.presetMenu.contains(
            event.target
          ) &&
          event.target !==
          el.presetButton
        ) {

          el.presetMenu.classList.remove(
            "open"
          );

        }

      }
    );


    document
      .querySelectorAll(
        ".preset-option"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () =>
              setPreset(
                button.dataset.preset
              )
          );

        }
      );


    updatePresetUI();


    /* ========================================================
       CLEAR CHAT
       ======================================================== */

    function clearChat() {

      if (
        !confirm(
          "Clear this single chat?"
        )
      ) {

        return;

      }


      state.conversation =
        [];


      saveState();


      el.messages.innerHTML =
        "";


      showWelcome();


      el.input.focus();

    }


    /* ========================================================
       EXPORT
       ======================================================== */

    function exportChat() {

      const blob =
        new Blob(

          [
            JSON.stringify(
              state,
              null,
              2
            )
          ],

          {
            type:
              "application/json"
          }

        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        "greg_chat_state.json";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      URL.revokeObjectURL(
        url
      );

    }


    /* ========================================================
       REPLAY
       ======================================================== */

    function replayConversation() {

      el.messages.innerHTML =
        "";


      if (
        state.conversation.length ===
        0
      ) {

        showWelcome();

        return;

      }


      for (
        const item
        of state.conversation
      ) {

        if (
          item.role ===
          "user"
        ) {

          addUserMessage(
            item.content
          );

        } else if (
          item.role ===
          "assistant"
        ) {

          addStaticGregMessage(
            item.content
          );

        }

      }


      scrollBottom(
        false
      );

    }


    /* ========================================================
       INPUT
       ======================================================== */

    el.input.addEventListener(
      "input",
      resizeInput
    );


    el.input.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* ========================================================
       BUTTONS
       ======================================================== */

    el.sendBtn.addEventListener(
      "click",
      sendMessage
    );


    el.testBtn.addEventListener(
      "click",
      testApi
    );


    el.clearBtn.addEventListener(
      "click",
      clearChat
    );


    el.exportBtn.addEventListener(
      "click",
      exportChat
    );


    /* ========================================================
       STARTUP
       ======================================================== */

    replayConversation();

    updateUI();

    resizeInput();


    /*
     * Connection test does not disable the text box.
     */

    setTimeout(
      testApi,
      500
    );


    setTimeout(
      () => {

        el.input.focus();

      },
      700
    );

  </script>

</body>
