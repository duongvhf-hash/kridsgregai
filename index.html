<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Greg AI</title>

  <script>
    window.gregDocxReady =
      import(
        "https://cdn.jsdelivr.net/npm/docx@9.7.1/+esm"
      )
        .then(
          module => {

            window.GregDocx =
              module;

            return module;

          }
        )
        .catch(
          error => {

            console.error(
              "DOCX library failed to load:",
              error
            );

            return null;

          }
        );
  </script>


  <style>

    :root {

      --bg: #050b08;
      --bg2: #030605;

      --text: #ecf7ef;
      --muted: #92a99d;

      --accent: #8df0a0;
      --accent-2: #54c7ff;

      --good: #8df0a0;
      --warn: #ffd56a;
      --bad: #ff7f7f;

      --line: rgba(255,255,255,0.08);

      --code-bg: #0a0d0c;
      --code-header: #111614;
      --code-line: rgba(255,255,255,0.06);
      --code-text: #d7e8dd;

      --shadow:
        0 22px 60px rgba(0,0,0,0.42);

      --sans:
        Inter,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;

      --mono:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      color: var(--text);

      font-family: var(--sans);

      background:
        radial-gradient(
          circle at top,
          rgba(105,255,170,0.12),
          transparent 34%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(84,199,255,0.08),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          var(--bg),
          var(--bg2) 72%
        );

      overflow: hidden;
    }


    button,
    textarea {
      font: inherit;
    }


    /* ========================================================
       ANIMATED BACKGROUND
       ======================================================== */

    #bgCanvas {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;

      pointer-events: none;
    }


    .animated-bg {

      position: fixed;
      inset: 0;

      z-index: 0;

      overflow: hidden;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(141,240,160,0.10),
          transparent 22%
        ),
        radial-gradient(
          circle at 80% 15%,
          rgba(84,199,255,0.10),
          transparent 20%
        ),
        radial-gradient(
          circle at 50% 78%,
          rgba(255,213,106,0.08),
          transparent 24%
        ),
        linear-gradient(
          180deg,
          rgba(3,6,5,0.92),
          rgba(5,11,8,0.96)
        );
    }


    .animated-bg::before,
    .animated-bg::after {

      content: "";

      position: absolute;

      inset: -35%;

      background-repeat: no-repeat;

      filter:
        blur(32px)
        saturate(1.3);

      opacity: 0.85;

      animation:
        bgDrift 12s ease-in-out infinite alternate,
        bgHue 22s linear infinite;
    }


    .animated-bg::before {

      background-image:
        radial-gradient(
          circle at 14% 24%,
          rgba(255,93,184,0.30),
          transparent 18%
        ),
        radial-gradient(
          circle at 42% 18%,
          rgba(84,199,255,0.32),
          transparent 19%
        ),
        radial-gradient(
          circle at 78% 24%,
          rgba(141,240,160,0.30),
          transparent 20%
        ),
        radial-gradient(
          circle at 24% 78%,
          rgba(255,213,106,0.24),
          transparent 22%
        ),
        radial-gradient(
          circle at 72% 74%,
          rgba(160,102,255,0.28),
          transparent 20%
        );
    }


    .animated-bg::after {

      background-image:
        radial-gradient(
          circle at 18% 52%,
          rgba(84,199,255,0.20),
          transparent 16%
        ),
        radial-gradient(
          circle at 52% 34%,
          rgba(255,120,120,0.16),
          transparent 15%
        ),
        radial-gradient(
          circle at 82% 58%,
          rgba(141,240,160,0.20),
          transparent 16%
        ),
        radial-gradient(
          circle at 50% 92%,
          rgba(255,255,255,0.05),
          transparent 24%
        );

      animation-duration:
        16s,
        28s;

      animation-direction:
        alternate-reverse,
        normal;

      opacity: 0.7;
    }


    .animated-grid {

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        );

      background-size: 64px 64px;

      mask-image:
        radial-gradient(
          circle at center,
          black 22%,
          transparent 78%
        );

      opacity: 0.25;

      animation:
        gridFloat 20s linear infinite;
    }


    .animated-scanline {

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 0%,
          rgba(255,255,255,0.03) 50%,
          transparent 100%
        );

      background-size:
        100% 220px;

      opacity: 0.13;

      mix-blend-mode: screen;

      animation:
        scanMove 7s linear infinite;
    }


    @keyframes bgDrift {

      0% {

        transform:
          translate3d(-2%, -1%, 0)
          scale(1.02)
          rotate(0deg);
      }

      50% {

        transform:
          translate3d(1.8%, 1.4%, 0)
          scale(1.08)
          rotate(6deg);
      }

      100% {

        transform:
          translate3d(-1%, 2%, 0)
          scale(1.04)
          rotate(-5deg);
      }
    }


    @keyframes bgHue {

      0% {

        filter:
          blur(32px)
          saturate(1.3)
          hue-rotate(0deg);
      }

      100% {

        filter:
          blur(32px)
          saturate(1.45)
          hue-rotate(360deg);
      }
    }


    @keyframes gridFloat {

      from {
        transform:
          translate3d(0,0,0);
      }

      to {
        transform:
          translate3d(64px,64px,0);
      }
    }


    @keyframes scanMove {

      from {
        transform:
          translateY(-220px);
      }

      to {
        transform:
          translateY(220px);
      }
    }


    /* ========================================================
       APP
       ======================================================== */

    .app {

      position: relative;

      z-index: 2;

      width: 100%;
      height: 100vh;

      display:
        flex;

      flex-direction:
        column;
    }


    /* ========================================================
       TOP BAR
       ======================================================== */

    .topbar {

      height: 66px;

      flex: none;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        0 20px;

      border-bottom:
        1px solid var(--line);

      background:
        rgba(5,11,8,0.72);

      backdrop-filter:
        blur(18px);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.12);

      animation:
        topbarIn .5s ease both;
    }


    @keyframes topbarIn {

      from {

        opacity: 0;

        transform:
          translateY(-16px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    .title-wrap {

      display:
        flex;

      align-items:
        center;

      gap: 11px;
    }


    .orb {

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background:
        var(--warn);

      box-shadow:
        0 0 18px
        rgba(255,213,106,0.7);

      transition:
        background .25s ease,
        box-shadow .25s ease,
        transform .3s ease;
    }


    .orb.online {

      background:
        var(--good);

      transform:
        scale(1.15);

      animation:
        orbPulse 2s ease-in-out infinite;
    }


    @keyframes orbPulse {

      0%,
      100% {

        box-shadow:
          0 0 12px
          rgba(141,240,160,0.55);
      }

      50% {

        box-shadow:
          0 0 24px
          rgba(141,240,160,0.95);
      }
    }


    .brand {

      display:
        flex;

      align-items:
        baseline;

      gap: 7px;
    }


    .title {

      font-weight: 900;

      letter-spacing:
        .06em;

      font-size:
        15px;
    }


    .version {

      color:
        var(--muted);

      font-size:
        11px;
    }


    .status-line {

      color:
        var(--muted);

      font-size:
        11px;

      margin-top:
        2px;
    }


    .top-actions {

      display:
        flex;

      gap:
        7px;
    }


    .icon-btn {

      width: 38px;
      height: 38px;

      border-radius:
        12px;

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.04);

      color:
        var(--text);

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .icon-btn:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.08);

      border-color:
        rgba(255,255,255,0.16);
    }


    /* ========================================================
       CHAT
       ======================================================== */

    .chat-shell {

      position:
        relative;

      flex:
        1;

      min-height:
        0;

      display:
        flex;

      justify-content:
        center;
    }


    .chat-column {

      width:
        min(920px,100%);

      height:
        100%;

      min-height:
        0;
    }


    .messages {

      width:
        100%;

      height:
        100%;

      overflow-y:
        auto;

      padding:
        30px 24px 220px;

      scroll-behavior:
        smooth;

      scrollbar-width:
        thin;

      scrollbar-color:
        rgba(255,255,255,.14)
        transparent;
    }


    .messages::-webkit-scrollbar {

      width:
        10px;
    }


    .messages::-webkit-scrollbar-thumb {

      background:
        rgba(255,255,255,0.12);

      border-radius:
        999px;

      border:
        2px solid transparent;

      background-clip:
        content-box;
    }


    /* ========================================================
       WELCOME
       ======================================================== */

    .welcome {

      min-height:
        calc(100vh - 270px);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      padding:
        40px 10px;

      animation:
        welcomeIn .7s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes welcomeIn {

      from {

        opacity: 0;

        transform:
          translateY(22px)
          scale(.98);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .welcome-orb {

      width: 72px;
      height: 72px;

      border-radius:
        24px;

      display:
        grid;

      place-items:
        center;

      color:
        #07210f;

      font-size:
        30px;

      font-weight:
        1000;

      background:
        linear-gradient(
          135deg,
          #adffc0,
          #65db89
        );

      box-shadow:
        0 20px 55px
        rgba(109,227,139,0.22);

      animation:
        welcomeOrb 2.8s ease-in-out infinite;
    }


    @keyframes welcomeOrb {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-5px);
      }
    }


    .welcome h1 {

      margin:
        22px 0 8px;

      font-size:
        clamp(30px,5vw,48px);

      letter-spacing:
        -.04em;
    }


    .welcome p {

      max-width:
        580px;

      margin:
        0;

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.65;
    }


    .welcome-suggestions {

      display:
        grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:
        10px;

      width:
        min(620px,100%);

      margin-top:
        24px;
    }


    .suggestion {

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.035);

      color:
        var(--text);

      border-radius:
        16px;

      padding:
        12px 14px;

      text-align:
        left;

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .suggestion:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.07);

      border-color:
        rgba(141,240,160,0.2);
    }


    .suggestion-title {

      font-size:
        12px;

      font-weight:
        800;
    }


    .suggestion-text {

      color:
        var(--muted);

      font-size:
        12px;

      line-height:
        1.4;

      margin-top:
        4px;
    }


    /* ========================================================
       MESSAGE ROWS
       ======================================================== */

    .message-row {

      display:
        flex;

      gap:
        14px;

      margin-bottom:
        28px;

      animation:
        messageIn .38s cubic-bezier(.2,.8,.2,1) both;
    }


    .message-row.removing {

      animation:
        messageOut .28s cubic-bezier(.4,0,1,1) forwards;
    }


    @keyframes messageOut {

      from {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }

      to {

        opacity:
          0;

        transform:
          translateY(-12px)
          scale(.96);
      }
    }


    @keyframes messageIn {

      from {

        opacity:
          0;

        transform:
          translateY(12px)
          scale(.99);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .message-row.user {

      justify-content:
        flex-end;
    }


    .message-row.greg {

      justify-content:
        flex-start;
    }


    .avatar {

      width: 32px;
      height: 32px;

      flex:
        none;

      border-radius:
        11px;

      display:
        grid;

      place-items:
        center;

      font-size:
        12px;

      font-weight:
        900;

      margin-top:
        2px;
    }


    .greg .avatar {

      background:
        linear-gradient(
          135deg,
          #a5ffb3,
          #68dc8c
        );

      color:
        #06210e;

      box-shadow:
        0 8px 20px
        rgba(109,227,139,.16);
    }


    .user .avatar {

      background:
        linear-gradient(
          135deg,
          #73d2ff,
          #4a92ff
        );

      color:
        #06121c;
    }


    .message-content {

      max-width:
        min(760px,calc(100% - 52px));

      min-width:
        0;
    }


    .message-name {

      font-size:
        11px;

      font-weight:
        800;

      color:
        var(--muted);

      margin-bottom:
        5px;
    }


    .message-text {

      white-space:
        pre-wrap;

      word-break:
        break-word;

      line-height:
        1.65;

      font-size:
        15px;
    }


    .user .message-content {

      padding:
        12px 15px;

      border-radius:
        18px;

      background:
        linear-gradient(
          180deg,
          rgba(84,199,255,.17),
          rgba(84,199,255,.08)
        );

      border:
        1px solid
        rgba(84,199,255,.20);
    }


    /* ========================================================
       SENT IMAGES
       ======================================================== */

    .sent-image-strip {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

      margin-bottom:
        9px;

      animation:
        sentImagesIn .32s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes sentImagesIn {

      from {

        opacity:
          0;

        transform:
          translateY(8px)
          scale(.98);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .sent-image {

      width:
        120px;

      height:
        120px;

      overflow:
        hidden;

      border-radius:
        14px;

      border:
        1px solid
        rgba(255,255,255,.10);

      background:
        rgba(255,255,255,.04);

      box-shadow:
        0 10px 24px
        rgba(0,0,0,.20);

      animation:
        sentImageIn .28s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes sentImageIn {

      from {

        opacity:
          0;

        transform:
          scale(.85)
          translateY(6px);
      }

      to {

        opacity:
          1;

        transform:
          scale(1)
          translateY(0);
      }
    }


    .sent-image img {

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

      display:
        block;
    }


    /* ========================================================
       SENT FILES
       ======================================================== */

    .sent-file-strip {

      display:
        flex;

      flex-direction:
        column;

      gap:
        8px;

      margin-bottom:
        10px;

      animation:
        sentFilesIn .35s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes sentFilesIn {

      from {

        opacity:
          0;

        transform:
          translateY(10px)
          scale(.97);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .sent-file-card {

      display:
        flex;

      align-items:
        center;

      gap:
        10px;

      min-width:
        240px;

      padding:
        10px 12px;

      border-radius:
        13px;

      border:
        1px solid
        rgba(255,255,255,.09);

      background:
        rgba(255,255,255,.045);

      box-shadow:
        0 10px 24px
        rgba(0,0,0,.16);

      animation:
        fileCardIn .38s cubic-bezier(.2,.8,.2,1) both;

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
    }


    .sent-file-card:hover {

      transform:
        translateY(-3px)
        scale(1.01);

      background:
        rgba(255,255,255,.075);

      border-color:
        rgba(141,240,160,.23);

      box-shadow:
        0 15px 30px
        rgba(0,0,0,.24),
        0 0 0 1px
        rgba(141,240,160,.04);
    }


    @keyframes fileCardIn {

      from {

        opacity:
          0;

        transform:
          translateY(12px)
          scale(.88)
          rotateX(-8deg);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1)
          rotateX(0);
      }
    }


    .file-card-icon {

      width:
        36px;

      height:
        42px;

      border-radius:
        9px;

      display:
        grid;

      place-items:
        center;

      flex:
        none;

      font-size:
        10px;

      font-weight:
        900;

      color:
        #06210e;

      background:
        linear-gradient(
          135deg,
          #adffc0,
          #68dc8c
        );

      box-shadow:
        0 8px 18px
        rgba(109,227,139,.13);

      animation:
        fileIconPulse 2.2s ease-in-out infinite;
    }


    @keyframes fileIconPulse {

      0%,
      100% {

        transform:
          translateY(0)
          rotate(0deg);
      }

      50% {

        transform:
          translateY(-2px)
          rotate(1deg);
      }
    }


    .file-card-info {

      min-width:
        0;

      flex:
        1;
    }


    .file-card-type {

      color:
        #9cf0ad;

      font-size:
        10px;

      font-weight:
        900;

      letter-spacing:
        .05em;

      text-transform:
        uppercase;
    }


    .file-card-name {

      color:
        var(--text);

      font-size:
        12px;

      font-weight:
        800;

      white-space:
        nowrap;

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      margin-top:
        2px;
    }


    .file-card-meta {

      color:
        var(--muted);

      font-size:
        10px;

      margin-top:
        2px;
    }


    /* ========================================================
       GENERATED FILES
       ======================================================== */

    .generated-file-list {

      display:
        flex;

      flex-direction:
        column;

      gap:
        10px;

      margin:
        12px 0 2px;

      animation:
        generatedListIn .38s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes generatedListIn {

      from {

        opacity:
          0;

        transform:
          translateY(10px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    .generated-file-card {

      position:
        relative;

      display:
        flex;

      align-items:
        center;

      gap:
        12px;

      width:
        min(620px,100%);

      padding:
        12px 13px;

      border-radius:
        16px;

      border:
        1px solid
        rgba(141,240,160,.16);

      background:
        linear-gradient(
          180deg,
          rgba(141,240,160,.07),
          rgba(255,255,255,.025)
        );

      box-shadow:
        0 12px 28px
        rgba(0,0,0,.22);

      cursor:
        pointer;

      overflow:
        hidden;

      animation:
        generatedFileIn .48s cubic-bezier(.16,1,.3,1) both;

      transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }


    .generated-file-card::after {

      content:
        "";

      position:
        absolute;

      inset:
        0;

      background:
        linear-gradient(
          110deg,
          transparent,
          rgba(255,255,255,.07),
          transparent
        );

      transform:
        translateX(-120%);

      animation:
        fileShine 1.5s .15s ease both;

      pointer-events:
        none;
    }


    .generated-file-card:hover {

      transform:
        translateY(-3px)
        scale(1.01);

      border-color:
        rgba(141,240,160,.32);

      background:
        linear-gradient(
          180deg,
          rgba(141,240,160,.11),
          rgba(255,255,255,.035)
        );

      box-shadow:
        0 16px 35px
        rgba(0,0,0,.28),
        0 0 0 1px
        rgba(141,240,160,.04);
    }


    .generated-file-card:active {

      transform:
        translateY(0)
        scale(.985);
    }


    .generated-file-card.removing {

      animation:
        generatedFileOut .30s cubic-bezier(.4,0,1,1) forwards;
    }


    @keyframes generatedFileIn {

      from {

        opacity:
          0;

        transform:
          translateY(18px)
          scale(.86)
          rotateX(-10deg);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1)
          rotateX(0);
      }
    }


    @keyframes generatedFileOut {

      from {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }

      to {

        opacity:
          0;

        transform:
          translateY(-12px)
          scale(.86);
      }
    }


    @keyframes fileShine {

      from {

        transform:
          translateX(-120%);
      }

      to {

        transform:
          translateX(120%);
      }
    }


    .generated-file-icon {

      width:
        46px;

      height:
        52px;

      flex:
        none;

      border-radius:
        12px;

      display:
        grid;

      place-items:
        center;

      color:
        #06210e;

      background:
        linear-gradient(
          135deg,
          #a9ffba,
          #66da89
        );

      font-size:
        10px;

      font-weight:
        1000;

      box-shadow:
        0 10px 22px
        rgba(109,227,139,.15);

      animation:
        generatedIconFloat 2.4s ease-in-out infinite;
    }


    @keyframes generatedIconFloat {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-3px);
      }
    }


    .generated-file-info {

      flex:
        1;

      min-width:
        0;
    }


    .generated-file-label {

      color:
        #a6ffb5;

      font-size:
        10px;

      font-weight:
        900;

      text-transform:
        uppercase;

      letter-spacing:
        .07em;
    }


    .generated-file-name {

      margin-top:
        3px;

      font-size:
        14px;

      font-weight:
        900;

      white-space:
        nowrap;

      overflow:
        hidden;

      text-overflow:
        ellipsis;
    }


    .generated-file-meta {

      margin-top:
        3px;

      color:
        var(--muted);

      font-size:
        10px;
    }


    .generated-file-download {

      flex:
        none;

      border:
        1px solid
        rgba(255,255,255,.10);

      background:
        rgba(255,255,255,.05);

      color:
        var(--text);

      border-radius:
        10px;

      padding:
        8px 10px;

      font-size:
        10px;

      font-weight:
        900;

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .generated-file-download:hover {

      transform:
        translateY(-2px)
        scale(1.03);

      background:
        rgba(141,240,160,.12);

      border-color:
        rgba(141,240,160,.25);
    }


    .generated-file-download:active {

      transform:
        translateY(0)
        scale(.95);
    }


    .generated-file-loading {

      display:
        inline-flex;

      align-items:
        center;

      gap:
        6px;

      color:
        var(--muted);

      font-size:
        10px;
    }


    .generated-file-loading-dot {

      width:
        5px;

      height:
        5px;

      border-radius:
        50%;

      background:
        var(--accent);

      animation:
        generatedLoading 1s ease-in-out infinite;
    }


    .generated-file-loading-dot:nth-child(2) {

      animation-delay:
        .12s;
    }


    .generated-file-loading-dot:nth-child(3) {

      animation-delay:
        .24s;
    }


    @keyframes generatedLoading {

      0%,
      80%,
      100% {

        opacity:
          .3;

        transform:
          translateY(0);
      }

      40% {

        opacity:
          1;

        transform:
          translateY(-3px);
      }
    }


    /* ========================================================
       THINKING
       ======================================================== */

    .typing-dots {

      display:
        inline-flex;

      gap:
        5px;

      padding-top:
        5px;
    }


    .typing-dots span {

      width:
        7px;

      height:
        7px;

      border-radius:
        50%;

      background:
        rgba(236,247,239,.7);

      animation:
        typingBounce 1s infinite ease-in-out;
    }


    .typing-dots span:nth-child(2) {
      animation-delay: .12s;
    }


    .typing-dots span:nth-child(3) {
      animation-delay: .24s;
    }


    @keyframes typingBounce {

      0%,
      80%,
      100% {

        transform:
          translateY(0);

        opacity:
          .45;
      }

      40% {

        transform:
          translateY(-5px);

        opacity:
          1;
      }
    }


    /* ========================================================
       THINKING PANEL
       ======================================================== */

    .thinking-panel {

      max-height:
        0;

      overflow:
        hidden;

      opacity:
        0;

      transform:
        translateY(7px);

      margin:
        0;

      transition:
        max-height .42s cubic-bezier(.16,1,.3,1),
        opacity .25s ease,
        transform .35s cubic-bezier(.2,.8,.2,1),
        margin .35s ease;
    }


    .thinking-panel.visible {

      max-height:
        6000px;

      opacity:
        1;

      transform:
        translateY(0);

      margin:
        0 0 10px;
    }


    .thinking-panel.closing {

      max-height:
        0;

      opacity:
        0;

      transform:
        translateY(-6px);

      margin:
        0;
    }


    .thinking-header {

      display:
        flex;

      align-items:
        center;

      gap:
        7px;

      min-height:
        20px;

      color:
        #858d87;

      font-size:
        13px;

      font-weight:
        700;

      user-select:
        none;
    }


    .thinking-dot {

      width:
        6px;

      height:
        6px;

      flex:
        none;

      border-radius:
        50%;

      background:
        #7f8782;

      animation:
        thinkingDotPulse 1.15s ease-in-out infinite;
    }


    @keyframes thinkingDotPulse {

      0%,
      100% {

        opacity:
          .35;

        transform:
          scale(.8);
      }

      50% {

        opacity:
          1;

        transform:
          scale(1);
      }
    }


    .thinking-label {

      display:
        inline-flex;

      align-items:
        center;

      font-size:
        13px;
    }


    .thinking-label-char {

      display:
        inline-block;

      white-space:
        pre;

      animation:
        thinkingLabelWave 1.4s ease-in-out infinite;

      animation-delay:
        var(--thinking-delay);
    }


    @keyframes thinkingLabelWave {

      0%,
      100% {

        transform:
          translateY(0);

        opacity:
          .55;
      }

      50% {

        transform:
          translateY(-2px);

        opacity:
          1;
      }
    }


    .thinking-content {

      margin-top:
        8px;

      padding-left:
        13px;

      color:
        #717a74;

      font-size:
        12px;

      line-height:
        1.55;

      white-space:
        pre-wrap;

      overflow-wrap:
        anywhere;
    }


    /* ========================================================
       STREAM CURSOR
       ======================================================== */

    .stream-cursor {

      display:
        inline-block;

      width:
        7px;

      height:
        18px;

      margin-left:
        4px;

      vertical-align:
        -3px;

      border-radius:
        2px;

      background:
        rgba(236,247,239,.8);

      animation:
        cursorBlink .85s steps(1) infinite;
    }


    @keyframes cursorBlink {

      50% {
        opacity: 0;
      }
    }


    /* ========================================================
       ORDERED CODE BLOCK
       ======================================================== */

    .code-block-shell {

      display:
        grid;

      grid-template-rows:
        0fr;

      opacity:
        0;

      transform:
        translateY(10px)
        scale(.985);

      margin:
        0;

      transition:
        grid-template-rows .42s cubic-bezier(.16,1,.3,1),
        opacity .30s ease,
        transform .42s cubic-bezier(.16,1,.3,1),
        margin .42s ease;
    }


    .code-block-shell.open {

      grid-template-rows:
        1fr;

      opacity:
        1;

      transform:
        translateY(0)
        scale(1);

      margin:
        13px 0;
    }


    .code-block-inner {

      min-height:
        0;

      overflow:
        hidden;
    }


    .code-block {

      width:
        100%;

      border:
        1px solid
        rgba(255,255,255,0.09);

      border-radius:
        15px;

      overflow:
        hidden;

      background:
        var(--code-bg);

      box-shadow:
        0 12px 28px
        rgba(0,0,0,0.22);
    }


    .code-header {

      min-height:
        38px;

      padding:
        0 10px 0 13px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;

      border-bottom:
        1px solid
        var(--code-line);

      background:
        var(--code-header);

      animation:
        codeHeaderIn .30s .05s ease both;
    }


    @keyframes codeHeaderIn {

      from {

        opacity:
          0;

        transform:
          translateY(-5px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    .code-header-left {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;

      min-width:
        0;
    }


    .code-language {

      color:
        #aab9b1;

      font-family:
        var(--mono);

      font-size:
        11px;

      font-weight:
        700;
    }


    .code-filename {

      color:
        #7eea96;

      font-size:
        10px;

      font-weight:
        800;

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;
    }


    .code-actions {

      display:
        flex;

      align-items:
        center;

      gap:
        6px;

      flex:
        none;
    }


    .code-copy,
    .code-download {

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.04);

      color:
        #c8d2cc;

      border-radius:
        8px;

      padding:
        5px 8px;

      cursor:
        pointer;

      font-size:
        11px;

      transition:
        background .12s ease,
        transform .12s ease,
        border-color .12s ease;
    }


    .code-copy:hover,
    .code-download:hover {

      background:
        rgba(255,255,255,0.09);

      transform:
        translateY(-1px);

      border-color:
        rgba(141,240,160,.18);
    }


    .code-content {

      overflow-x:
        auto;

      padding:
        14px;

      color:
        var(--code-text);

      font-family:
        var(--mono);

      font-size:
        13px;

      line-height:
        1.6;

      white-space:
        pre;

      tab-size:
        4;

      min-height:
        18px;
    }


    .code-content::-webkit-scrollbar {

      height:
        8px;
    }


    .code-content::-webkit-scrollbar-thumb {

      background:
        rgba(255,255,255,0.12);

      border-radius:
        999px;
    }


    .code-block.live {

      border-color:
        rgba(141,240,160,0.17);

      box-shadow:
        0 12px 28px rgba(0,0,0,0.22),
        0 0 0 1px
        rgba(141,240,160,0.035);
    }


    /* ========================================================
       COMPOSER
       ======================================================== */

    .composer-area {

      position:
        fixed;

      left:
        0;

      right:
        0;

      bottom:
        0;

      z-index:
        10;

      display:
        flex;

      justify-content:
        center;

      padding:
        0 20px 20px;

      pointer-events:
        none;
    }


    .composer-wrap {

      width:
        min(820px,100%);

      pointer-events:
        auto;

      position:
        relative;
    }


    .composer-glow {

      position:
        absolute;

      inset:
        -18px -35px -25px;

      background:
        radial-gradient(
          ellipse at center bottom,
          rgba(141,240,160,.13),
          transparent 65%
        );

      filter:
        blur(20px);

      pointer-events:
        none;
    }


    .composer {

      position:
        relative;

      border:
        1px solid
        rgba(255,255,255,.11);

      border-radius:
        24px;

      background:
        rgba(8,14,11,.90);

      backdrop-filter:
        blur(20px);

      box-shadow:
        0 22px 60px
        rgba(0,0,0,.4);

      padding:
        10px;

      animation:
        composerIn .65s cubic-bezier(.2,.8,.2,1) both;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        transform .18s ease;
    }


    .composer:focus-within {

      border-color:
        rgba(141,240,160,.3);

      box-shadow:
        0 25px 70px rgba(0,0,0,.42),
        0 0 0 3px
        rgba(141,240,160,.05);

      transform:
        translateY(-1px);
    }


    @keyframes composerIn {

      from {

        opacity:
          0;

        transform:
          translateY(22px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    /* ========================================================
       IMAGE / FILE ATTACHMENTS
       ======================================================== */

    .attachment-strip,
    .file-attachment-strip {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        9px;

      padding:
        4px 4px 10px;

      overflow:
        hidden;

      animation:
        attachmentStripIn .28s cubic-bezier(.2,.8,.2,1) both;
    }


    .attachment-strip.hidden,
    .file-attachment-strip.hidden {

      display:
        none;
    }


    @keyframes attachmentStripIn {

      from {

        opacity:
          0;

        transform:
          translateY(8px);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0);
      }
    }


    .attachment-item,
    .file-attachment-item {

      position:
        relative;

      width:
        78px;

      height:
        78px;

      flex:
        none;

      border-radius:
        14px;

      overflow:
        visible;

      background:
        rgba(255,255,255,.04);

      border:
        1px solid
        rgba(255,255,255,.11);

      box-shadow:
        0 10px 24px
        rgba(0,0,0,.22);

      animation:
        attachmentIn .28s cubic-bezier(.2,.8,.2,1) both;

      transition:
        transform .17s ease,
        border-color .17s ease,
        background .17s ease;
    }


    .file-attachment-item {

      height:
        66px;

      width:
        250px;

      display:
        flex;

      align-items:
        center;

      padding:
        8px;

    }


    .file-attachment-item:hover {

      transform:
        translateY(-2px)
        scale(1.015);

      border-color:
        rgba(141,240,160,.23);

      background:
        rgba(255,255,255,.065);
    }


    @keyframes attachmentIn {

      from {

        opacity:
          0;

        transform:
          translateY(10px)
          scale(.82);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .attachment-item.removing,
    .file-attachment-item.removing {

      animation:
        attachmentOut .22s ease forwards;
    }


    @keyframes attachmentOut {

      from {

        opacity:
          1;

        transform:
          scale(1);
      }

      to {

        opacity:
          0;

        transform:
          scale(.72)
          translateY(5px);
      }
    }


    .attachment-item img {

      width:
        100%;

      height:
        100%;

      display:
        block;

      border-radius:
        13px;

      object-fit:
        cover;
    }


    .file-attachment-icon {

      width:
        34px;

      height:
        38px;

      flex:
        none;

      border-radius:
        8px;

      display:
        grid;

      place-items:
        center;

      background:
        linear-gradient(
          135deg,
          #a5ffb3,
          #68dc8c
        );

      color:
        #06210e;

      font-size:
        9px;

      font-weight:
        1000;

      animation:
        fileAttachmentFloat 2.3s ease-in-out infinite;
    }


    @keyframes fileAttachmentFloat {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-2px);
      }
    }


    .file-attachment-info {

      flex:
        1;

      min-width:
        0;

      padding:
        0 7px;
    }


    .file-attachment-type {

      color:
        #8ff0a0;

      font-size:
        9px;

      font-weight:
        900;

      text-transform:
        uppercase;

      letter-spacing:
        .05em;
    }


    .file-attachment-name {

      color:
        var(--text);

      font-size:
        10px;

      font-weight:
        800;

      margin-top:
        2px;

      white-space:
        nowrap;

      overflow:
        hidden;

      text-overflow:
        ellipsis;
    }


    .file-attachment-number {

      color:
        var(--muted);

      font-size:
        9px;

      margin-top:
        2px;
    }


    .attachment-remove {

      position:
        absolute;

      top:
        -7px;

      right:
        -7px;

      width:
        22px;

      height:
        22px;

      padding:
        0;

      border:
        1px solid
        rgba(255,255,255,.15);

      border-radius:
        50%;

      background:
        rgba(8,14,11,.95);

      color:
        #ecf7ef;

      font-size:
        13px;

      line-height:
        20px;

      cursor:
        pointer;

      display:
        grid;

      place-items:
        center;

      box-shadow:
        0 6px 14px
        rgba(0,0,0,.32);

      z-index:
        2;

      transition:
        transform .15s ease,
        background .15s ease,
        opacity .15s ease;
    }


    .attachment-remove:hover {

      transform:
        scale(1.08);

      background:
        rgba(255,127,127,.18);
    }


    .attachment-name {

      position:
        absolute;

      left:
        4px;

      right:
        4px;

      bottom:
        4px;

      padding:
        3px 5px;

      border-radius:
        7px;

      color:
        rgba(236,247,239,.88);

      background:
        rgba(0,0,0,.58);

      backdrop-filter:
        blur(6px);

      font-size:
        8px;

      white-space:
        nowrap;

      overflow:
        hidden;

      text-overflow:
        ellipsis;
    }


    /* ========================================================
       INPUT ROW
       ======================================================== */

    .input-row {

      display:
        grid;

      grid-template-columns:
        1fr auto;

      gap:
        8px;

      align-items:
        end;
    }


    .composer textarea {

      width:
        100%;

      min-height:
        52px;

      max-height:
        190px;

      resize:
        none;

      border:
        0;

      outline:
        none;

      background:
        transparent;

      color:
        var(--text);

      padding:
        12px 12px 10px;

      line-height:
        1.5;

      font-size:
        15px;
    }


    .composer textarea::placeholder {

      color:
        #81968a;
    }


    .send-btn {

      min-width:
        96px;

      height:
        46px;

      border:
        0;

      border-radius:
        15px;

      background:
        linear-gradient(
          180deg,
          #a5ffb3,
          #6ce38b
        );

      color:
        #07210f;

      font-weight:
        900;

      cursor:
        pointer;

      box-shadow:
        0 10px 22px
        rgba(108,227,139,.18);

      transition:
        transform .13s ease,
        filter .13s ease,
        opacity .13s ease;
    }


    .send-btn:hover {

      transform:
        translateY(-1px);

      filter:
        brightness(1.04);
    }


    .send-btn:disabled {

      opacity:
        .55;

      cursor:
        not-allowed;

      transform:
        none;
    }


    .composer-bottom {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        10px;

      padding:
        6px 3px 1px;
    }


    .composer-left {

      display:
        flex;

      align-items:
        center;

      gap:
        8px;
    }


    /* ========================================================
       ATTACH BUTTON
       ======================================================== */

    .attach-menu-wrap {

      position:
        relative;
    }


    .attach-button {

      width:
        32px;

      height:
        32px;

      border:
        1px solid
        rgba(255,255,255,.08);

      background:
        rgba(255,255,255,.04);

      color:
        var(--text);

      border-radius:
        999px;

      padding:
        0;

      cursor:
        pointer;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      font-size:
        20px;

      line-height:
        1;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .attach-button:hover {

      transform:
        translateY(-1px)
        rotate(4deg);

      background:
        rgba(255,255,255,.08);

      border-color:
        rgba(255,255,255,.16);
    }


    .attach-button.open {

    const SFX_MAX_PITCH =
      1.20;


    function playSfx(
      file
    ) {

      const audio =
        new Audio(
          file
        );


      audio.volume =
        SFX_VOLUME;


      audio.playbackRate =
        SFX_MIN_PITCH
        +
        Math.random()
        *
        (
          SFX_MAX_PITCH
          -
          SFX_MIN_PITCH
        );


      audio.play().catch(
        () => {}
      );

    }


    function playHover1() {

            "button,.generated-file-card,.sent-file-card,.file-attachment-item"

        if (
          !target
        ) {

          return;

        }


        if (
          target ===

        ) {

          return;

        }


        lastHoverTarget =
          target;


        if (

          target.classList.contains(
            "attach-button"

          ||

          target.classList.contains(
            "attachment-remove"
          )

          ||

          target.classList.contains(

    function resizeCanvas() {

      const dpr =
        Math.max(
          1,
          window.devicePixelRatio || 1
        );


      canvas.width =
        Math.floor(
          window.innerWidth *
          dpr
        );


      canvas.height =
        Math.floor(
          window.innerHeight *
          dpr
        );


      canvas.style.width =
        window.innerWidth +
        "px";


      canvas.style.height =
        window.innerHeight +
        "px";


      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );

    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );


    resizeCanvas();


    const particles =
      Array.from(
        {
          length:
            42
        },
        () => ({

          x:
            Math.random() *
            window.innerWidth,

          y:
            Math.random() *
            window.innerHeight,

          r:
            18 +
            Math.random() *
            55,

          vx:
            (
              Math.random() -
              0.5
            ) *
            0.22,

          vy:
            (
              Math.random() -
              0.5
            ) *
            0.18,

          hue:
            Math.floor(
              Math.random() *
              360
            ),

          alpha:
            0.05 +
            Math.random() *
            0.18,

          pulse:
            Math.random() *
            Math.PI *
            2

        })
      );


    function drawCanvasBg() {

      const w =
        window.innerWidth;


      const h =
        window.innerHeight;


      ctx.clearRect(
        0,
        0,
        w,
        h
      );


      const g =
        ctx.createLinearGradient(
          0,
          0,
          w,
          h
        );


      g.addColorStop(
        0,
        "rgba(10,18,14,0.10)"
      );


      g.addColorStop(
        1,
        "rgba(3,6,5,0.14)"
      );


      ctx.fillStyle =
        g;


      ctx.fillRect(
        0,
        0,
        w,
        h
      );


      ctx.save();


      ctx.globalCompositeOperation =
        "lighter";


      for (
        const p
        of particles
      ) {

        p.x +=
          p.vx;


        p.y +=
          p.vy;


        p.pulse +=
          0.018;


        if (
          p.x < -120
        ) {

          p.x =
            w + 120;

        }


        if (
          p.x > w + 120
        ) {

          p.x =
            -120;

        }


        if (
          p.y < -120
        ) {

          p.y =
            h + 120;

        }


        if (
          p.y > h + 120
        ) {

          p.y =
            -120;

        }


        const r =
          p.r +
          Math.sin(
            p.pulse
          ) *
          10;


        const grad =
          ctx.createRadialGradient(
            p.x,
            p.y,
            0,
            p.x,
            p.y,
            r
          );


        grad.addColorStop(
          0,
          `hsla(
            ${p.hue},
            95%,
            72%,
            ${p.alpha}
          )`
        );


        grad.addColorStop(
          0.45,
          `hsla(
            ${(p.hue + 40) % 360},
            95%,
            62%,
            ${p.alpha * 0.45}
          )`
        );


        grad.addColorStop(
          1,
          "rgba(0,0,0,0)"
        );


        ctx.fillStyle =
          grad;


        ctx.beginPath();


        ctx.arc(
          p.x,
          p.y,
          r,
          0,
          Math.PI * 2
        );


        ctx.fill();

      }


      ctx.restore();


      requestAnimationFrame(
        drawCanvasBg
      );

    }

      const map = {

      if (

            "/"
          )[1]
          .toUpperCase();

      }


      if (
        file.type &&
        file.type.startsWith(
          "text/"
        )
      ) {

        return "TEXT";

      }


      return extension
        ? extension.toUpperCase()
        : "FILE";

    }


    function readAnyFile(
      file
    ) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const reader =
            new FileReader();


          reader.onload =
            () => {

              resolve({

                id:
                  makeFileId(),

                name:
                  file.name,

                type:
                  file.type,

                size:
                  file.size,

                fileType:
                  getClientFileType(
                    file
                  ),

                dataUrl:
                  reader.result

              });

            };


          reader.onerror =
            () => {

              reject(
                reader.error
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }


    function addFileObject(
      file
    ) {

      pendingFiles.push(
        file
      );


      if (
        file.type &&
        file.type.startsWith(
          "image/"
        )
      ) {

        pendingImages.push({

          id:
            file.id,

          name:
            file.name,

          type:
            file.type,

          size:
            file.size,

          dataUrl:
            file.dataUrl

        });

      }

    }

    function removePendingFile(
      id
    ) {

      const item =
        document.querySelector(
          `[data-file-id="${id}"]`
        );


      playClick();


      if (
        item
      ) {

        item.classList.add(
          "removing"
        );


        setTimeout(
          () => {

            pendingFiles =
              pendingFiles.filter(
                file =>
                  file.id !==
                  id
              );


            pendingImages =
              pendingImages.filter(
                image =>
                  image.id !==
                  id
              );


            renderImagePreviews();

            renderFilePreviews();

          },
          220
        );


        return;

      }


      pendingFiles =
        pendingFiles.filter(
          file =>
            file.id !==
            id
        );


      pendingImages =
        pendingImages.filter(
          image =>
            image.id !==
            id
        );


      renderImagePreviews();

      renderFilePreviews();

    }

        !images.length

        el.attachmentStrip.innerHTML =

      el.attachmentStrip.classList.remove(

      images.forEach(

            document.createElement(

            );

            "attachment-item";


          item.dataset.imageId =
            image.id;


          item.dataset.fileId =
            image.id;


          const img =
            document.createElement(
              "img"
            );


          img.src =
            image.dataUrl;


          img.alt =
            image.name ||
            "Attached image";


          const remove =
            document.createElement(
              "button"
            );


          remove.type =
            "button";


          remove.className =
            "attachment-remove";


          remove.textContent =

          const name =
            document.createElement(
              "div"
            );


          name.className =
            "attachment-name";


          name.textContent =

          item.appendChild(
            remove

          item.appendChild(
            name
          );


          el.attachmentStrip.appendChild(
            item
          );

      );

    function fileSizeText(
      bytes
    ) {

      const size =
        Number(
          bytes || 0
        );


      if (
        size < 1024
      ) {

        return `${size} B`;

      }


      if (
        size < 1024 * 1024
      ) {

        return `${(
          size /
          1024
        ).toFixed(1)} KB`;

      }


      return `${(
        size /
        (
          1024 *
          1024
        )
      ).toFixed(1)} MB`;

    }


    function dataUrlToUint8Array(
      dataUrl
    ) {

      const encoded =
        dataUrl.split(
          ",",
          2
        )[1] ||
        "";


      const binary =
        atob(
          encoded
        );


      const bytes =
        new Uint8Array(
          binary.length
        );


      for (
        let i = 0;
        i < binary.length;
        i++
      ) {

        bytes[i] =
          binary.charCodeAt(
            i
          );

      }


      return bytes;

    }


    async function dataUrlToPngBytes(
      dataUrl
    ) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const img =
            new Image();


          img.onload =
            () => {

              const canvas =
                document.createElement(
                  "canvas"
                );


              const maxSize =
                1800;


              let width =
                img.naturalWidth;


              let height =
                img.naturalHeight;


              if (
                width >
                maxSize
                ||
                height >
                maxSize
              ) {

                const scale =
                  Math.min(

                    maxSize /
                    width,

                    maxSize /
                    height

                  );


                width =
                  Math.max(
                    1,
                    Math.floor(
                      width *
                      scale
                    )
                  );


                height =
                  Math.max(
                    1,
                    Math.floor(
                      height *
                      scale
                    )
                  );

              }


              canvas.width =
                width;


              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                blob => {

                  if (
                    !blob
                  ) {

                    reject(
                      new Error(
                        "Could not convert image."
                      )
                    );

                    return;

                  }


                  blob.arrayBuffer()
                    .then(
                      buffer =>
                        resolve(
                          new Uint8Array(
                            buffer
                          )
                        )
                    )
                    .catch(
                      reject
                    );

                },
                "image/png"
              );

            };


          img.onerror =
            () =>
              reject(
                new Error(
                  "Could not load image."
                )
              );


          img.src =
            dataUrl;

        }
      );

    }


    async function createShapePngBytes(
      shape,
      text,
      width = 500,
      height = 140
    ) {

      const safeWidth =
        Math.max(
          80,
          Number(
            width || 500
          )
        );


      const safeHeight =
        Math.max(
          50,
          Number(
            height || 140
          )
        );


      const shapeName =
        String(
          shape ||
          "rectangle"
        ).toLowerCase();


      let body =
        "";


      if (
        shapeName ===
        "circle"
        ||
        shapeName ===
        "ellipse"
      ) {

        body =
          `
            <ellipse
              cx="${safeWidth / 2}"
              cy="${safeHeight / 2}"
              rx="${safeWidth / 2 - 5}"
              ry="${safeHeight / 2 - 5}"
              fill="#8df0a0"
              stroke="#285f36"
              stroke-width="5"
            />
          `;

      } else if (
        shapeName ===
        "roundedRectangle"
        ||
        shapeName ===
        "rounded-rectangle"
        ||
        shapeName ===
        "roundrect"
      ) {

        body =
          `
            <rect
              x="4"
              y="4"
              width="${safeWidth - 8}"
              height="${safeHeight - 8}"
              rx="24"
              fill="#8df0a0"
              stroke="#285f36"
              stroke-width="5"
            />
          `;

      } else {

        body =
          `
            <rect
              x="4"
              y="4"
              width="${safeWidth - 8}"
              height="${safeHeight - 8}"
              fill="#8df0a0"
              stroke="#285f36"
              stroke-width="5"
            />
          `;

      }


      const escapedText =
        String(
          text ||
          ""
        )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        );


      const svg =

        `
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="${safeWidth}"
          height="${safeHeight}"
          viewBox="0 0 ${safeWidth} ${safeHeight}"
        >

          ${body}

          <text
            x="${safeWidth / 2}"
            y="${safeHeight / 2 + 7}"
            text-anchor="middle"
            font-family="Arial, sans-serif"
            font-size="24"
            font-weight="700"
            fill="#07210f"
          >
            ${escapedText}
          </text>

        </svg>
        `;


      const blob =
        new Blob(
          [
            svg
          ],
          {
            type:
              "image/svg+xml"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      try {

        const dataUrl =
          await new Promise(
            (
              resolve,
              reject
            ) => {

              const img =
                new Image();


              img.onload =
                () => {

                  const canvas =
                    document.createElement(
                      "canvas"
                    );


                  canvas.width =
                    safeWidth;


                  canvas.height =
                    safeHeight;


                  const context =
                    canvas.getContext(
                      "2d"
                    );


                  context.drawImage(
                    img,
                    0,
                    0
                  );


                  resolve(
                    canvas.toDataURL(
                      "image/png"
                    )
                  );

                };


              img.onerror =
                reject;


              img.src =
                url;

            }
          );


        return (
          dataUrlToUint8Array(
            dataUrl
          )
        );

      } finally {

        URL.revokeObjectURL(
          url
        );

      }

    }


    function getUploadedImageByIndex(
      index
    ) {

      const images =
        pendingFiles.filter(
          file =>
            file.type &&
            file.type.startsWith(
              "image/"
            )
        );


      const target =
        images[
          Number(
            index
          )
        ];


      return target ||
        null;

    }


    async function generateDocxBlob(
      file
    ) {

      const module =
        await (
          window.gregDocxReady ||
          Promise.resolve(
            window.GregDocx
          )
        );


      if (
        !module
      ) {

        throw new Error(
          "DOCX library is unavailable."
        );

      }


      const {
        Document,
        Packer,
        Paragraph,
        TextRun,
        HeadingLevel,
        Table,
        TableRow,
        TableCell,
        ImageRun
      } =
        module;


      const content =
        Array.isArray(
          file.content
        )
          ? file.content
          : [];


      const children =
        [];


      for (
        const item
        of content
      ) {

        if (
          !item
          ||
          typeof item !==
          "object"
        ) {

          continue;

        }


        const type =
          String(
            item.type ||
            "paragraph"
          ).toLowerCase();


        if (
          type ===
          "heading"
        ) {

          children.push(

            new Paragraph({

              text:
                String(
                  item.text ||
                  ""
                ),

              heading:
                HeadingLevel.HEADING_1

            })

          );


          continue;

        }


        if (
          type ===
          "paragraph"
        ) {

          children.push(

            new Paragraph({

              children: [

                new TextRun({

                  text:
                    String(
                      item.text ||
                      ""
                    )

                })

              ]

            })

          );


          continue;

        }


        if (
          type ===
          "code"
        ) {

          children.push(

            new Paragraph({

              children: [

                new TextRun({

                  text:
                    String(
                      item.text ||
                      ""
                    ),

                  font:
                    "Consolas",

                  size:
                    20

                })

              ],

              spacing: {

                after:
                  120

              }

            })

          );


          continue;

        }


        if (
          type ===
          "table"
        ) {

          const rows =
            Array.isArray(
              item.rows
            )
              ? item.rows
              : [];


          const docxRows =
            [];


          for (
            const row
            of rows
          ) {

            const cells =
              Array.isArray(
                row
              )
                ? row
                : [];


            docxRows.push(

              new TableRow({

                children:
                  cells.map(
                    cell =>
                      new TableCell({

                        children: [

                          new Paragraph({

                            children: [

                              new TextRun({

                                text:
                                  String(
                                    cell ??
                                    ""
                                  )

                              })

                            ]

                          })

                        ]

                      })
                  )

              })

            );

          }


          if (
            docxRows.length
          ) {

            children.push(

              new Table({

                rows:
                  docxRows

              })

            );

            children.push(
              new Paragraph({})
            );

          }


          continue;

        }


        if (
          type ===
          "image"
        ) {

          let uploaded =
            null;


          const source =
            String(
              item.source ||
              ""
            );


          if (
            source.startsWith(
              "uploaded:"
            )
          ) {

            uploaded =
              getUploadedImageByIndex(

                Number(
                  source.split(
                    ":"
                  )[1]
                )

              );

          }


          if (
            uploaded
          ) {

            const imageBytes =
              await dataUrlToPngBytes(
                uploaded.dataUrl
              );


            children.push(

              new Paragraph({

                children: [

                  new ImageRun({

                    data:
                      imageBytes,

                    transformation: {

                      width:
                        Math.max(
                          80,
                          Number(
                            item.width ||
                            450
                          )
                        ),

                      height:
                        Math.max(
                          60,
                          Number(
                            item.height ||
                            300
                          )
                        )

                    },

                    type:
                      "png"

                  })

                ]

              })

            );

          }


          continue;

        }


        if (
          type ===
          "shape"
        ) {

          const shapeBytes =
            await createShapePngBytes(

              item.shape,

              item.text,

              item.width,

              item.height

            );


          children.push(

            new Paragraph({

              children: [

                new ImageRun({

                  data:
                    shapeBytes,

                  transformation: {

                    width:
                      Math.max(
                        100,
                        Number(
                          item.width ||
                          500
                        )
                      ),

                    height:
                      Math.max(
                        60,
                        Number(
                          item.height ||
                          140
                        )
                      )

                  },

                  type:
                    "png"

                })

              ]

            })

          );


          continue;

        }

      }


      if (
        !children.length
      ) {

        children.push(

          new Paragraph({

            children: [

              new TextRun({

                text:
                  "Generated by Greg AI."

              })

            ]

          })

        );

      }


      const documentFile =
        new Document({

          sections: [

            {

              children:
                children

            }

          ]

        });


      return Packer.toBlob(
        documentFile
      );

    }


    async function createGeneratedBlob(
      file
    ) {

      const type =
        String(
          file.type ||
          ""
        ).toLowerCase();


      const filename =
        String(
          file.filename ||
          "greg-file"
        );


      if (
        type ===
        "docx"
        ||
        filename.toLowerCase().endsWith(
          ".docx"
        )
      ) {

        return {

          blob:
            await generateDocxBlob(
              file
            ),

          mime:
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

        };

      }


      if (
        type ===
        "json"
        &&
        typeof file.content !==
        "string"
      ) {

        return {

          blob:
            new Blob(
              [
                JSON.stringify(
                  file.content,
                  null,
                  2
                )
              ],
              {
                type:
                  "application/json"
              }
            ),

          mime:
            "application/json"

        };

      }


      if (
        typeof file.content ===
        "string"
      ) {

        return {

          blob:
            new Blob(
              [
                file.content
              ],
              {
                type:
                  "text/plain;charset=utf-8"
              }
            ),

          mime:
            "text/plain;charset=utf-8"

        };

      }


      return {

        blob:
          new Blob(
            [
              JSON.stringify(
                file.content ||
                {},
                null,
                2
              )
            ],
            {
              type:

    async function downloadGeneratedFile(
      card,
      file
    ) {

      const button =
        card.querySelector(
          ".generated-file-download"
        );


      const originalText =
        button
          ? button.textContent
          : "Download";


      if (
        button
      ) {

        button.textContent =
          "Building...";

      }


      try {

        const result =
          await createGeneratedBlob(
            file
          );


        const url =
          URL.createObjectURL(
            result.blob
          );


        const anchor =
          document.createElement(
            "a"
          );


        anchor.href =
          url;


        anchor.download =
          file.filename ||
          "greg-file";


        document.body.appendChild(
          anchor
        );


        requestAnimationFrame(
          () => {

            anchor.click();

          }
        );


        anchor.remove();


        setTimeout(
          () => {

            URL.revokeObjectURL(
              url
            );

          },
          1000
        );


        if (
          button
        ) {

          button.textContent =
            "Downloaded!";

          button.classList.add(
            "generated-download-done"
          );

          setTimeout(
            () => {

              button.textContent =
                originalText;

              button.classList.remove(
                "generated-download-done"
              );

            },
            1100
          );

        }


      } catch (
        error
      ) {

        console.error(
          "Could not generate file:",
          error
        );


        if (
          button
        ) {

          button.textContent =
            "Failed";

          setTimeout(
            () => {

              button.textContent =
                originalText;

            },
            1200
          );

        }

      }

    }

    function buildWavyText(
      element,
      text,
      startIndex = 0
    ) {

      const chars =
        Array.from(
          String(text)
        );


      let index =
        startIndex;


      for (
        const char
        of chars
      ) {

        if (
          char ===
          "\n"
        ) {

          element.appendChild(
            document.createElement(
              "br"
            )
          );


          index += 1;


          continue;

        }


        const span =
          document.createElement(
            "span"
          );


        span.className =
          "thinking-label-char";


        span.textContent =
          char;


        const waveDelay =
          (
            index *
            0.06
          );


        span.style.setProperty(
          "--thinking-delay",
          `${waveDelay}s`
        );


        element.appendChild(
          span
        );


        index += 1;

      }


      return index;

    }

    function startThinkingUI(
      stream
    ) {

      if (
        stream.thinkingStarted
      ) {

      }


      stream.thinkingStarted =
        true;


      stream.thinkingEnded =

      stream.thinkingContent.textContent =

    function finishThinkingUI(
      stream
    ) {

      if (
        !stream.thinkingStarted ||
        stream.thinkingEnded
      ) {

        return;

      }


      stream.thinkingEnded =
        true;


      stream.thinkingPanel.classList.add(
        "closing"
      );


      setTimeout(
        () => {

          if (
            stream.thinkingPanel
          ) {

            stream.thinkingPanel.classList.remove(
              "visible"
            );

        },
        420
      );

    }


    function processThinkingStream(
      chunk,
      parser,
      stream
    ) {

      if (
        !chunk
      ) {

        return;

      }


      stream.thinkingBuffer +=
        chunk;


      while (
        stream.thinkingBuffer.length
      ) {

        if (
          !stream.thinkingMode
        ) {

          const startIndex =
            stream.thinkingBuffer.indexOf(
              "<think>"
            );


          if (
            startIndex ===
            -1
          ) {

            const keepLength =
              "<think>".length - 1;


            if (
              stream.thinkingBuffer.length <=
              keepLength
            ) {

              return;

            }


            const safeLength =
              stream.thinkingBuffer.length -
              keepLength;


            const safeText =
              stream.thinkingBuffer.slice(
                0,
                safeLength
              );


            stream.thinkingBuffer =
              stream.thinkingBuffer.slice(
                safeLength
              );


            if (
              safeText
            ) {

              stream.answerText +=
                safeText;


              parser.feed(
                safeText
              );

            }


            continue;

          }


          const answerBeforeThink =
            stream.thinkingBuffer.slice(
              0,
              startIndex
            );


          if (
            answerBeforeThink
          ) {

            stream.answerText +=
              answerBeforeThink;


            parser.feed(
              answerBeforeThink
            );

          }


          stream.thinkingBuffer =
            stream.thinkingBuffer.slice(
              startIndex +
              "<think>".length
            );


          stream.thinkingMode =
            true;


          startThinkingUI(
            stream
          );


          continue;

        }


        const endIndex =
          stream.thinkingBuffer.indexOf(
            "</think>"
          );


        if (
          endIndex ===
          -1
        ) {

          const keepLength =
            "</think>".length - 1;


          if (
            stream.thinkingBuffer.length <=
            keepLength
          ) {

            return;

          }


          const safeLength =
            stream.thinkingBuffer.length -
            keepLength;


          const thinkingText =
            stream.thinkingBuffer.slice(
              0,
              safeLength
            );


          stream.thinkingBuffer =
            stream.thinkingBuffer.slice(
              safeLength
            );


          appendThinkingText(
            stream,
            thinkingText
          );


          continue;

        }


        const thinkingText =
          stream.thinkingBuffer.slice(
            0,
            endIndex
          );


        if (
          thinkingText
        ) {

          appendThinkingText(
            stream,
            thinkingText
          );

        }


        stream.thinkingBuffer =
          stream.thinkingBuffer.slice(
            endIndex +
            "</think>".length
          );


        stream.thinkingMode =
          false;


        finishThinkingUI(
          stream
        );


        continue;

      }

    }


    function finishThinkingStream(
      parser,
      stream
    ) {

      if (
        !stream.thinkingBuffer
      ) {

        return;

      }


      if (
        stream.thinkingMode
      ) {

        appendThinkingText(
          stream,
          stream.thinkingBuffer
        );


        stream.thinkingBuffer =
          "";


        finishThinkingUI(
          stream
        );


        return;

      }


      stream.answerText +=
        stream.thinkingBuffer;


      parser.feed(
        stream.thinkingBuffer
      );


      stream.thinkingBuffer =
        "";

    }

    /* ========================================================
