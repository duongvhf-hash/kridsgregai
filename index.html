<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Greg AI</title>

  <style>

    :root {

      --bg: #050b08;
      --bg2: #030605;

      --text: #ecf7ef;
      --muted: #92a99d;

      --accent: #8df0a0;
      --accent-2: #54c7ff;

      --good: #8df0a0;
      --warn: #ffd56a;
      --bad: #ff7f7f;

      --line: rgba(255,255,255,0.08);

      --code-bg: #0a0d0c;
      --code-header: #111614;
      --code-line: rgba(255,255,255,0.06);
      --code-text: #d7e8dd;

      --shadow:
        0 22px 60px rgba(0,0,0,0.42);

      --sans:
        Inter,
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Arial,
        sans-serif;

      --mono:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      color: var(--text);

      font-family: var(--sans);

      background:
        radial-gradient(
          circle at top,
          rgba(105,255,170,0.12),
          transparent 34%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(84,199,255,0.08),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          var(--bg),
          var(--bg2) 72%
        );

      overflow: hidden;
    }


    button,
    textarea {
      font: inherit;
    }


    #bgCanvas {

      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;

      pointer-events: none;
    }


    .animated-bg {

      position: fixed;
      inset: 0;

      z-index: 0;

      overflow: hidden;

      pointer-events: none;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(141,240,160,0.10),
          transparent 22%
        ),
        radial-gradient(
          circle at 80% 15%,
          rgba(84,199,255,0.10),
          transparent 20%
        ),
        radial-gradient(
          circle at 50% 78%,
          rgba(255,213,106,0.08),
          transparent 24%
        ),
        linear-gradient(
          180deg,
          rgba(3,6,5,0.92),
          rgba(5,11,8,0.96)
        );
    }


    .animated-bg::before,
    .animated-bg::after {

      content: "";

      position: absolute;

      inset: -35%;

      background-repeat: no-repeat;

      filter:
        blur(32px)
        saturate(1.3);

      opacity: 0.85;

      animation:
        bgDrift 12s ease-in-out infinite alternate,
        bgHue 22s linear infinite;
    }


    .animated-bg::before {

      background-image:
        radial-gradient(
          circle at 14% 24%,
          rgba(255,93,184,0.30),
          transparent 18%
        ),
        radial-gradient(
          circle at 42% 18%,
          rgba(84,199,255,0.32),
          transparent 19%
        ),
        radial-gradient(
          circle at 78% 24%,
          rgba(141,240,160,0.30),
          transparent 20%
        ),
        radial-gradient(
          circle at 24% 78%,
          rgba(255,213,106,0.24),
          transparent 22%
        ),
        radial-gradient(
          circle at 72% 74%,
          rgba(160,102,255,0.28),
          transparent 20%
        );
    }


    .animated-bg::after {

      background-image:
        radial-gradient(
          circle at 18% 52%,
          rgba(84,199,255,0.20),
          transparent 16%
        ),
        radial-gradient(
          circle at 52% 34%,
          rgba(255,120,120,0.16),
          transparent 15%
        ),
        radial-gradient(
          circle at 82% 58%,
          rgba(141,240,160,0.20),
          transparent 16%
        ),
        radial-gradient(
          circle at 50% 92%,
          rgba(255,255,255,0.05),
          transparent 24%
        );

      animation-duration:
        16s,
        28s;

      animation-direction:
        alternate-reverse,
        normal;

      opacity: 0.7;
    }


    .animated-grid {

      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,0.035) 1px,
          transparent 1px
        );

      background-size: 64px 64px;

      mask-image:
        radial-gradient(
          circle at center,
          black 22%,
          transparent 78%
        );

      opacity: 0.25;

      animation:
        gridFloat 20s linear infinite;
    }


    .animated-scanline {

      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          180deg,
          transparent 0%,
          rgba(255,255,255,0.03) 50%,
          transparent 100%
        );

      background-size:
        100% 220px;

      opacity: 0.13;

      mix-blend-mode: screen;

      animation:
        scanMove 7s linear infinite;
    }


    @keyframes bgDrift {

      0% {

        transform:
          translate3d(-2%, -1%, 0)
          scale(1.02)
          rotate(0deg);
      }

      50% {

        transform:
          translate3d(1.8%, 1.4%, 0)
          scale(1.08)
          rotate(6deg);
      }

      100% {

        transform:
          translate3d(-1%, 2%, 0)
          scale(1.04)
          rotate(-5deg);
      }
    }


    @keyframes bgHue {

      0% {

        filter:
          blur(32px)
          saturate(1.3)
          hue-rotate(0deg);
      }

      100% {

        filter:
          blur(32px)
          saturate(1.45)
          hue-rotate(360deg);
      }
    }


    @keyframes gridFloat {

      from {
        transform:
          translate3d(0,0,0);
      }

      to {
        transform:
          translate3d(64px,64px,0);
      }
    }


    @keyframes scanMove {

      from {
        transform:
          translateY(-220px);
      }

      to {
        transform:
          translateY(220px);
      }
    }


    .app {

      position: relative;

      z-index: 2;

      width: 100%;
      height: 100vh;

      display:
        flex;

      flex-direction:
        column;
    }


    .topbar {

      height: 66px;

      flex: none;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        0 20px;

      border-bottom:
        1px solid var(--line);

      background:
        rgba(5,11,8,0.72);

      backdrop-filter:
        blur(18px);

      box-shadow:
        0 10px 30px rgba(0,0,0,0.12);

      animation:
        topbarIn .5s ease both;
    }


    @keyframes topbarIn {

      from {

        opacity: 0;

        transform:
          translateY(-16px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    .title-wrap {

      display:
        flex;

      align-items:
        center;

      gap: 11px;
    }


    .orb {

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background:
        var(--warn);

      box-shadow:
        0 0 18px
        rgba(255,213,106,0.7);

      transition:
        background .25s ease,
        box-shadow .25s ease,
        transform .3s ease;
    }


    .orb.online {

      background:
        var(--good);

      transform:
        scale(1.15);

      animation:
        orbPulse 2s ease-in-out infinite;
    }


    @keyframes orbPulse {

      0%,
      100% {

        box-shadow:
          0 0 12px
          rgba(141,240,160,0.55);
      }

      50% {

        box-shadow:
          0 0 24px
          rgba(141,240,160,0.95);
      }
    }


    .brand {

      display:
        flex;

      align-items:
        baseline;

      gap: 7px;
    }


    .title {

      font-weight: 900;

      letter-spacing:
        .06em;

      font-size:
        15px;
    }


    .version {

      color:
        var(--muted);

      font-size:
        11px;
    }


    .status-line {

      color:
        var(--muted);

      font-size:
        11px;

      margin-top:
        2px;
    }


    .top-actions {

      display:
        flex;

      gap:
        7px;
    }


    .icon-btn {

      width: 38px;
      height: 38px;

      border-radius:
        12px;

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.04);

      color:
        var(--text);

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .icon-btn:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.08);

      border-color:
        rgba(255,255,255,0.16);
    }


    .chat-shell {

      position:
        relative;

      flex:
        1;

      min-height:
        0;

      display:
        flex;

      justify-content:
        center;
    }


    .chat-column {

      width:
        min(920px,100%);

      height:
        100%;

      min-height:
        0;
    }


    .messages {

      width:
        100%;

      height:
        100%;

      overflow-y:
        auto;

      padding:
        30px 24px 220px;

      scroll-behavior:
        smooth;

      scrollbar-width:
        thin;

      scrollbar-color:
        rgba(255,255,255,.14)
        transparent;
    }


    .messages::-webkit-scrollbar {

      width:
        10px;
    }


    .messages::-webkit-scrollbar-thumb {

      background:
        rgba(255,255,255,0.12);

      border-radius:
        999px;

      border:
        2px solid transparent;

      background-clip:
        content-box;
    }


    .welcome {

      min-height:
        calc(100vh - 270px);

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      text-align:
        center;

      padding:
        40px 10px;

      animation:
        welcomeIn .7s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes welcomeIn {

      from {

        opacity: 0;

        transform:
          translateY(22px)
          scale(.98);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .welcome-orb {

      width: 72px;
      height: 72px;

      border-radius:
        24px;

      display:
        grid;

      place-items:
        center;

      color:
        #07210f;

      font-size:
        30px;

      font-weight:
        1000;

      background:
        linear-gradient(
          135deg,
          #adffc0,
          #65db89
        );

      box-shadow:
        0 20px 55px
        rgba(109,227,139,0.22);

      animation:
        welcomeOrb 2.8s ease-in-out infinite;
    }


    @keyframes welcomeOrb {

      0%,
      100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-5px);
      }
    }


    .welcome h1 {

      margin:
        22px 0 8px;

      font-size:
        clamp(30px,5vw,48px);

      letter-spacing:
        -.04em;
    }


    .welcome p {

      max-width:
        580px;

      margin:
        0;

      color:
        var(--muted);

      font-size:
        14px;

      line-height:
        1.65;
    }


    .welcome-suggestions {

      display:
        grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:
        10px;

      width:
        min(620px,100%);

      margin-top:
        24px;
    }


    .suggestion {

      border:
        1px solid
        rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.035);

      color:
        var(--text);

      border-radius:
        16px;

      padding:
        12px 14px;

      text-align:
        left;

      cursor:
        pointer;

      transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
    }


    .suggestion:hover {

      transform:
        translateY(-2px);

      background:
        rgba(255,255,255,0.07);

      border-color:
        rgba(141,240,160,0.2);
    }


    .suggestion-title {

      font-size:
        12px;

      font-weight:
        800;
    }


    .suggestion-text {

      color:
        var(--muted);

      font-size:
        12px;

      line-height:
        1.4;

      margin-top:
        4px;
    }


    .message-row {

      display:
        flex;

      gap:
        14px;

      margin-bottom:
        28px;

      animation:
        messageIn .38s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes messageIn {

      from {

        opacity:
          0;

        transform:
          translateY(12px)
          scale(.99);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .message-row.user {

      justify-content:
        flex-end;
    }


    .message-row.greg {

      justify-content:
        flex-start;
    }


    .avatar {

      width: 32px;
      height: 32px;

      flex:
        none;

      border-radius:
        11px;

      display:
        grid;

      place-items:
        center;

      font-size:
        12px;

      font-weight:
        900;

      margin-top:
        2px;
    }


    .greg .avatar {

      background:
        linear-gradient(
          135deg,
          #a5ffb3,
          #68dc8c
        );

      color:
        #06210e;

      box-shadow:
        0 8px 20px
        rgba(109,227,139,.16);
    }


    .user .avatar {

      background:
        linear-gradient(
          135deg,
          #73d2ff,
          #4a92ff
        );

      color:
        #06121c;
    }


    .message-content {

      max-width:
        min(760px,calc(100% - 52px));

      min-width:
        0;
    }


    .message-name {

      font-size:
        11px;

      font-weight:
        800;

      color:
        var(--muted);

      margin-bottom:
        5px;
    }


    .message-text {

      white-space:
        pre-wrap;

      word-break:
        break-word;

      line-height:
        1.65;

      font-size:
        15px;
    }


    .user .message-content {

      padding:
        12px 15px;

      border-radius:
        18px;

      background:
        linear-gradient(
          180deg,
          rgba(84,199,255,.17),
          rgba(84,199,255,.08)
        );

      border:
        1px solid
        rgba(84,199,255,.20);
    }


    .sent-image-strip {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

      margin-bottom:
        9px;

      animation:
        sentImagesIn .32s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes sentImagesIn {

      from {

        opacity:
          0;

        transform:
          translateY(8px)
          scale(.98);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .sent-image {

      width:
        120px;

      height:
        120px;

      overflow:
        hidden;

      border-radius:
        14px;

      border:
        1px solid
        rgba(255,255,255,.10);

      background:
        rgba(255,255,255,.04);

      box-shadow:
        0 10px 24px
        rgba(0,0,0,.20);

      animation:
        sentImageIn .28s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes sentImageIn {

      from {

        opacity:
          0;

        transform:
          scale(.85)
          translateY(6px);
      }

      to {

        opacity:
          1;

        transform:
          scale(1)
          translateY(0);
      }
    }


    .sent-image img {

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

      display:
        block;
    }


    /* ========================================================
       FILE CARDS
       ======================================================== */

    .sent-file-strip {

      display:
        flex;

      flex-direction:
        column;

      gap:
        8px;

      margin-bottom:
        9px;

      animation:
        fileStripIn .38s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes fileStripIn {

      from {

        opacity:
          0;

        transform:
          translateY(10px)
          scale(.98);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .file-card {

      position:
        relative;

      display:
        flex;

      align-items:
        center;

      gap:
        11px;

      min-width:
        0;

      padding:
        10px 12px;

      border:
        1px solid
        rgba(255,255,255,.09);

      border-radius:
        14px;

      background:
        rgba(255,255,255,.035);

      color:
        var(--text);

      box-shadow:
        0 10px 24px
        rgba(0,0,0,.16);

      overflow:
        hidden;

      transition:
        transform .16s ease,
        background .16s ease,
        border-color .16s ease,
        box-shadow .16s ease;
    }


    .file-card::after {

      content:
        "";

      position:
        absolute;

      left:
        -120%;

      top:
        0;

      width:
        80%;

      height:
        100%;

      background:
        linear-gradient(
          100deg,
          transparent,
          rgba(255,255,255,.08),
          transparent
        );

      animation:
        fileShimmer 1.2s ease both;
    }


    @keyframes fileShimmer {

      from {
        left:
          -120%;
      }

      to {
        left:
          140%;
      }
    }


    .file-card:hover {

      transform:
        translateY(-2px)
        scale(1.01);

      background:
        rgba(255,255,255,.065);

      border-color:
        rgba(141,240,160,.20);

      box-shadow:
        0 14px 28px
        rgba(0,0,0,.24);
    }


    .file-card.generated {

      cursor:
        pointer;
    }


    .file-card.removing {

      animation:
        fileCardOut .28s ease forwards;
    }


    @keyframes fileCardOut {

      from {

        opacity:
          1;

        transform:
          translateX(0)
          scale(1);
      }

      to {

        opacity:
          0;

        transform:
          translateX(-18px)
          scale(.92);
      }
    }


    .file-icon {

      width:
        38px;

      height:
        38px;

      flex:
        none;

      border-radius:
        11px;

      display:
        grid;

      place-items:
        center;

      font-size:
        10px;

      font-weight:
        900;

      letter-spacing:
        .03em;

      color:
        #06120c;

      background:
        linear-gradient(
          135deg,
          #a5ffb3,
          #68dc8c
        );

      box-shadow:
        0 8px 18px
        rgba(109,227,139,.16);

      animation:
        fileIconIn .42s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes fileIconIn {

      from {

        opacity:
          0;

        transform:
          scale(.72)
          rotate(-8deg);
      }

      to {

        opacity:
          1;

        transform:
          scale(1)
          rotate(0deg);
      }
    }


    .file-info {

      min-width:
        0;

      flex:
        1;
    }


    .file-name {

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

      font-size:
        12px;

      font-weight:
        850;
    }


    .file-type {

      margin-top:
        3px;

      color:
        var(--muted);

      font-size:
        10px;
    }


    .file-action {

      flex:
        none;

      min-width:
        28px;

      height:
        28px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius:
        9px;

      background:
        rgba(255,255,255,.04);

      color:
        var(--text);

      display:
        grid;

      place-items:
        center;

      font-size:
        12px;

      transition:
        transform .14s ease,
        background .14s ease;
    }


    .file-card:hover .file-action {

      transform:
        translateY(-1px)
        scale(1.04);

      background:
        rgba(141,240,160,.10);
    }


    .generated-file-card {

      cursor:
        pointer;

      animation:
        generatedFileIn .52s cubic-bezier(.2,.8,.2,1) both;
    }


    @keyframes generatedFileIn {

      from {

        opacity:
          0;

        transform:
          translateY(16px)
          scale(.94);
      }

      60% {

        opacity:
          1;

        transform:
          translateY(-2px)
          scale(1.01);
      }

      to {

        opacity:
          1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    .generated-file-card:active {

      transform:
        scale(.97);
    }


    .typing-dots {

      display:
        inline-flex;

      gap:
        5px;

      padding-top:
        5px;
    }


    .typing-dots span {

      width:
        7px;

      height:
        7px;

      border-radius:
        50%;

      background:
        rgba(236,247,239,.7);

      animation:
        typingBounce 1s infinite ease-in-out;
    }


    .typing-dots span:nth-child(2) {
      animation-delay: .12s;
    }


    .typing-dots span:nth-child(3) {
      animation-delay: .24s;
    }


    @keyframes typingBounce {

      0%,
      80%,
      100% {

        transform:
          translateY(0);

        opacity:
          .45;
      }

      40% {

        transform:
          translateY(-5px);

        opacity:
          1;
      }
    }


    .thinking-panel {

      max-height:
        0;

      overflow:
        hidden;

      opacity:
        0;

      transform:
        translateY(7px);

      margin:
        0;

      transition:
        max-height .42s cubic-bezier(.16,1,.3,1),
        opacity .25s ease,

          id="clearBtn"

        <div
          class="messages"
          id="messages"
        ></div>

      </div>


      <div class="composer-area">

        <div class="composer-wrap">

          <div class="composer-glow"></div>


          <div class="composer">


            <div
              class="attachment-strip hidden"
              id="attachmentStrip"
            ></div>


            <div
              class="file-attachment-strip"
              id="fileAttachmentStrip"
              style="display:none"
            ></div>


            <div class="input-row">

              <textarea
                id="input"
                rows="1"
                placeholder="Message Greg..."
              ></textarea>


              <button
                class="send-btn"
                id="sendBtn"
              >
                SEND
              </button>

            </div>


            <div class="composer-bottom">

              <div class="composer-left">


                <div class="attach-menu-wrap">

                  <button
                    class="attach-button"
                    id="attachButton"
                    type="button"
                    title="Add attachment"
                  >
                    +
                  </button>


                  <div
                    class="attach-menu"
                    id="attachMenu"
                  >

                    <button
                      class="attach-option"
                      id="uploadImageOption"
                      type="button"
                    >
                      Upload image
                    </button>


                    <button
                      class="attach-option"
                      id="uploadFileOption"
                      type="button"
                    >
                      Upload file
                    </button>

                  </div>


                  <input
                    id="imageInput"
                    type="file"
                    accept="image/*"
                    multiple
                  >


                  <input
                    id="fileInput"
                    type="file"
                    multiple
                    accept=".docx,.pptx,.py,.lua,.html,.htm,.js,.mjs,.cjs,.ts,.tsx,.css,.json,.xml,.svg,.sql,.md,.markdown,.txt,.log,.csv,.tsv,.c,.h,.cpp,.cc,.cxx,.hpp,.java,.cs,.rs,.go,.rb,.php,.sh,.bat,.cmd,.ps1,.yaml,.yml,.ini,.toml,.tex,.jsx,.dart,.swift,.kt,.kts,.zig,.asm,.s"
                  >

                </div>


                <div class="preset-menu-wrap">


                  <button
                    class="preset-button"
                    id="presetButton"
                    type="button"
                  >

                    <span class="preset-dot"></span>

                    <span
                      id="presetButtonText"
                    >
                      Default
                    </span>

                    <span>
                      ▾
                    </span>

                  </button>


                  <div
                    class="preset-menu"
                    id="presetMenu"
                  >


                    <button
                      class="preset-option"
                      data-preset="default"
                      type="button"
                    >

                      <span>

                        <span class="preset-name">
                          Default
                        </span>

                        <br>

                        <span class="preset-description">
                          Balanced
                        </span>

                      </span>

                      <span class="preset-check"></span>

                    </button>


                    <button
                      class="preset-option"
                      data-preset="fast"
                      type="button"
                    >

                      <span>

                        <span class="preset-name">
                          Fast
                        </span>

                        <br>

                        <span class="preset-description">
                          Shorter replies
                        </span>

                      </span>

                      <span class="preset-check"></span>

                    </button>


                    <button
                      class="preset-option"
                      data-preset="smart"
                      type="button"
                    >

                      <span>

                        <span class="preset-name">
                          Smart
                        </span>

                        <br>

                        <span class="preset-description">
                          Longer and better replies
                        </span>

                      </span>

                      <span class="preset-check"></span>

                    </button>


                  </div>

                </div>


                <div
                  class="composer-meta"
                  id="memoryHint"
                >
                  Ready
                </div>

              </div>


              <div class="composer-meta">
                Enter to send · Shift+Enter for newline
              </div>

            </div>

          </div>

        </div>

      </div>

    </main>

  </div>


<script src="script.js"></script>

</body>
</html>
